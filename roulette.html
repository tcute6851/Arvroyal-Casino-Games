<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>🎡 ArvRoyal Wheel – Wheel of Fortune</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,700;0,900;1,700&display=swap" rel="stylesheet" />

    <style>
        /* ─── CSS VARIABLES ─── */
        :root {
            --gold: #d4a847;
            --gold-light: #f0d080;
            --gold-dark: #b8923a;
            --gold-glow: rgba(212, 168, 71, 0.6);
            --gold-gradient: linear-gradient(135deg, #f7e5b0 0%, #d4a847 30%, #b8923a 60%, #d4a847 85%, #f7e5b0 100%);
            --ruby-gradient: linear-gradient(135deg, #e74c3c, #c0392b, #a93226);
            --bg-primary: #0a0a14;
            --bg-secondary: #12121f;
            --bg-panel: rgba(16, 14, 28, 0.85);
            --text-primary: #f5f0e8;
            --text-secondary: #b8aa9a;
            --text-muted: #6a5f55;
            --border-gold: rgba(212, 168, 71, 0.35);
            --shadow-heavy: 0 30px 80px rgba(0, 0, 0, 0.95), 0 8px 32px rgba(0, 0, 0, 0.6);
            --shadow-soft: 0 8px 32px rgba(0, 0, 0, 0.5);
            --radius-xl: 56px;
            --radius-lg: 32px;
            --radius-md: 18px;
            --radius-sm: 12px;
            --transition-smooth: 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            --font-display: 'Playfair Display', serif;
            --font-ui: 'Inter', system-ui, -apple-system, sans-serif;
            --font-orbitron: 'Orbitron', monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html {
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(ellipse at 50% 20%, #1c1410 0%, #07070d 70%, #030205 100%);
            font-family: var(--font-ui);
            padding: 16px;
            position: relative;
            overflow-x: hidden;
        }

        /* ─── LUXURIOUS ANIMATED BACKGROUND ─── */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(circle at 20% 30%, rgba(212, 168, 71, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(212, 168, 71, 0.04) 0%, transparent 50%),
                radial-gradient(circle at 50% 100%, rgba(192, 57, 43, 0.06) 0%, transparent 40%),
                radial-gradient(circle at 50% 0%, rgba(212, 168, 71, 0.03) 0%, transparent 40%);
            pointer-events: none;
            z-index: 0;
            animation: bgPulse 8s ease-in-out infinite alternate;
        }
        @keyframes bgPulse {
            0% {
                opacity: 0.7;
                transform: scale(1);
            }
            100% {
                opacity: 1;
                transform: scale(1.05);
            }
        }

        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                radial-gradient(1px 1px at 10% 20%, rgba(212, 168, 71, 0.15), transparent),
                radial-gradient(1px 1px at 30% 70%, rgba(212, 168, 71, 0.10), transparent),
                radial-gradient(1px 1px at 50% 10%, rgba(212, 168, 71, 0.12), transparent),
                radial-gradient(1px 1px at 70% 80%, rgba(212, 168, 71, 0.08), transparent),
                radial-gradient(1px 1px at 90% 40%, rgba(212, 168, 71, 0.14), transparent),
                radial-gradient(1px 1px at 15% 90%, rgba(212, 168, 71, 0.06), transparent),
                radial-gradient(1px 1px at 85% 15%, rgba(212, 168, 71, 0.10), transparent);
            background-size: 180px 180px;
            pointer-events: none;
            z-index: 0;
            animation: sparkleMove 20s linear infinite;
        }
        @keyframes sparkleMove {
            0% {
                transform: translateY(0) scale(1);
                opacity: 0.4;
            }
            50% {
                opacity: 0.9;
            }
            100% {
                transform: translateY(-100px) scale(1.1);
                opacity: 0.4;
            }
        }

        /* ─── MAIN CABINET – PREMIUM CASINO FINISH ─── */
        .wheel-machine {
            position: relative;
            z-index: 1;
            max-width: 880px;
            width: 100%;
            background: linear-gradient(170deg, #1e1814 0%, #0e0b0a 40%, #080507 100%);
            border-radius: var(--radius-xl);
            padding: 34px 32px 36px;
            box-shadow: var(--shadow-heavy), inset 0 1px 0 rgba(255, 255, 255, 0.06), inset 0 -2px 0 rgba(0, 0, 0, 0.9);
            border: 1px solid rgba(212, 168, 71, 0.2);
            backdrop-filter: blur(2px);
            transition: box-shadow 0.5s ease;
        }
        .wheel-machine:hover {
            box-shadow: var(--shadow-heavy), 0 0 80px rgba(212, 168, 71, 0.04), inset 0 1px 0 rgba(255, 255, 255, 0.08);
        }

        .wheel-machine::before {
            content: '';
            position: absolute;
            top: -1px;
            left: 40px;
            right: 40px;
            height: 4px;
            background: linear-gradient(90deg, transparent, var(--gold), #ffd700, var(--gold), transparent);
            border-radius: 0 0 50% 50%;
            opacity: 0.9;
            filter: blur(0.5px);
        }
        .wheel-machine::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 60px;
            right: 60px;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(212, 168, 71, 0.3), rgba(212, 168, 71, 0.6), rgba(212, 168, 71, 0.3), transparent);
            border-radius: 50% 50% 0 0;
            opacity: 0.7;
        }

        .corner-gem {
            position: absolute;
            width: 18px;
            height: 18px;
            background: var(--gold-gradient);
            clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
            opacity: 0.8;
            filter: blur(0.5px);
            box-shadow: 0 0 30px rgba(212, 168, 71, 0.2);
            transition: all 0.4s ease;
        }
        .corner-gem.tl { top: 16px; left: 24px; }
        .corner-gem.tr { top: 16px; right: 24px; }
        .corner-gem.bl { bottom: 16px; left: 24px; }
        .corner-gem.br { bottom: 16px; right: 24px; }
        .corner-gem:hover {
            opacity: 1;
            transform: scale(1.2);
            filter: blur(0);
        }

        .cabinet-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .top-left {
            display: flex;
            align-items: center;
            gap: 18px;
            flex-wrap: wrap;
        }

        .title {
            font-family: var(--font-display);
            font-size: 38px;
            font-weight: 900;
            font-style: italic;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 0 50px rgba(212, 168, 71, 0.25));
            letter-spacing: 1px;
            line-height: 1;
            position: relative;
        }
        .title .icon {
            -webkit-text-fill-color: initial;
            color: #f0d080;
            margin-right: 2px;
        }
        .title::after {
            content: '✦';
            font-size: 12px;
            -webkit-text-fill-color: initial;
            color: var(--gold);
            position: absolute;
            top: -6px;
            right: -28px;
            opacity: 0.6;
            font-style: normal;
            animation: sparkleGem 3s ease-in-out infinite;
        }
        @keyframes sparkleGem {
            0%, 100% { opacity: 0.3; transform: scale(0.8) rotate(0deg); }
            50% { opacity: 1; transform: scale(1.3) rotate(20deg); }
        }

        .user-name {
            font-family: var(--font-ui);
            font-size: 14px;
            font-weight: 600;
            color: var(--text-secondary);
            background: var(--bg-panel);
            padding: 6px 20px;
            border-radius: 40px;
            border: 1px solid var(--border-gold);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            gap: 8px;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        .user-name i {
            color: var(--gold);
            font-size: 12px;
        }
        .user-name:hover {
            border-color: rgba(212, 168, 71, 0.6);
            box-shadow: 0 0 30px rgba(212, 168, 71, 0.08);
        }

        .top-right {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .stats {
            display: flex;
            gap: 20px;
            background: var(--bg-panel);
            padding: 6px 24px 6px 28px;
            border-radius: 60px;
            border: 1px solid var(--border-gold);
            backdrop-filter: blur(12px);
            align-items: center;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04), var(--shadow-soft);
            flex-wrap: wrap;
            justify-content: center;
            position: relative;
        }
        .stats::after {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: 60px;
            padding: 1px;
            background: linear-gradient(180deg, rgba(212, 168, 71, 0.2), transparent 40%, transparent 60%, rgba(212, 168, 71, 0.1));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        .stat {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2px 0;
            position: relative;
        }
        .stat:not(:last-child)::after {
            content: '';
            position: absolute;
            right: -10px;
            top: 20%;
            height: 60%;
            width: 1px;
            background: linear-gradient(to bottom, transparent, rgba(212, 168, 71, 0.15), transparent);
        }
        .stat .label {
            font-size: 9px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2.2px;
            color: var(--text-muted);
            font-family: var(--font-ui);
        }
        .stat .value {
            font-size: 24px;
            font-weight: 800;
            color: var(--text-primary);
            min-width: 70px;
            text-align: center;
            font-variant-numeric: tabular-nums;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
        }
        .value.balance {
            color: #7dffb3;
            text-shadow: 0 0 30px rgba(125, 255, 179, 0.2);
        }
        .value.balance.update {
            animation: balancePulse 0.5s ease;
        }
        @keyframes balancePulse {
            0%, 100% { transform: scale(1); }
            40% { transform: scale(1.15); color: #b3ffd9; text-shadow: 0 0 60px rgba(125, 255, 179, 0.4); }
        }
        .value.win {
            color: var(--gold-light);
            text-shadow: 0 0 30px rgba(212, 168, 71, 0.25);
        }
        .value.win.update {
            animation: winPulse 0.6s ease;
        }
        @keyframes winPulse {
            0%, 100% { transform: scale(1); }
            30% { transform: scale(1.3); color: #ffd700; text-shadow: 0 0 60px rgba(212, 168, 71, 0.5); }
            70% { transform: scale(0.95); }
        }
        .stat .value .currency {
            font-size: 13px;
            opacity: 0.5;
            margin-right: 1px;
            font-weight: 600;
        }

        .mute-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: var(--text-secondary);
            font-size: 18px;
            border-radius: 30px;
            padding: 4px 12px;
            cursor: pointer;
            transition: var(--transition-smooth);
            backdrop-filter: blur(4px);
            line-height: 1;
        }
        .mute-btn:hover {
            background: rgba(212, 168, 71, 0.12);
            border-color: var(--gold);
            color: var(--gold);
            transform: scale(1.05);
        }
        .mute-btn:active { transform: scale(0.92); }

        .back-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: var(--text-secondary);
            padding: 6px 18px;
            border-radius: 30px;
            cursor: pointer;
            transition: var(--transition-smooth);
            font-family: var(--font-ui);
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            backdrop-filter: blur(4px);
        }
        .back-btn:hover {
            background: rgba(212, 168, 71, 0.12);
            border-color: var(--gold);
            color: var(--gold);
            transform: scale(1.03);
        }
        .back-btn:active { transform: scale(0.94); }

        .db-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.2);
            padding: 4px 14px;
            border-radius: 100px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.03);
        }
        .db-status i {
            font-size: 0.55rem;
            transition: color 0.3s;
        }
        .db-status.online i { color: #34d399; }
        .db-status.offline i {
            color: #f87171;
            animation: blink 1.2s ease-in-out infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.2; }
        }
        .db-status .status-label { color: rgba(255, 255, 255, 0.15); }
        .db-status .status-value { color: rgba(255, 255, 255, 0.4); font-weight: 500; }

        .wheel-area {
            position: relative;
            background: radial-gradient(ellipse at 50% 50%, #0d0a12, #050308);
            border-radius: var(--radius-lg);
            padding: 24px 18px;
            border: 1px solid rgba(212, 168, 71, 0.12);
            box-shadow: inset 0 8px 50px rgba(0, 0, 0, 0.95), inset 0 0 100px rgba(0, 0, 0, 0.6), 0 4px 20px rgba(0, 0, 0, 0.5);
            margin-bottom: 24px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 440px;
        }

        .wheel-area::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at 50% 50%, rgba(212, 168, 71, 0.05), transparent 70%);
            pointer-events: none;
            border-radius: inherit;
        }

        .wheel-area::after {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: var(--radius-lg);
            padding: 1px;
            background: linear-gradient(180deg, rgba(212, 168, 71, 0.15), transparent 30%, transparent 70%, rgba(212, 168, 71, 0.08));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        .wheel-wrapper {
            position: relative;
            width: 400px;
            height: 400px;
            max-width: 100%;
            aspect-ratio: 1/1;
        }

        #wheelCanvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            cursor: pointer;
            transition: filter 0.3s;
            box-shadow: 0 0 100px rgba(212, 168, 71, 0.08), inset 0 0 80px rgba(0, 0, 0, 0.3);
        }
        #wheelCanvas:hover {
            filter: brightness(1.04);
        }

        .wheel-pointer {
            position: absolute;
            top: -16px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 22px solid transparent;
            border-right: 22px solid transparent;
            border-top: 38px solid #ffd700;
            filter: drop-shadow(0 0 30px rgba(255, 215, 0, 0.6)) drop-shadow(0 4px 12px rgba(0, 0, 0, 0.5));
            z-index: 10;
            pointer-events: none;
        }
        .wheel-pointer::after {
            content: '';
            position: absolute;
            top: -38px;
            left: -12px;
            width: 24px;
            height: 24px;
            background: radial-gradient(circle, #ffd700, #b8860b);
            border-radius: 50%;
            box-shadow: 0 0 40px rgba(255, 215, 0, 0.4);
        }

        .wheel-center-dot {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: radial-gradient(circle at 40% 35%, #ffd700, #b8860b 60%, #8b6b0b);
            box-shadow: 0 0 50px rgba(255, 215, 0, 0.35), inset 0 -4px 8px rgba(0, 0, 0, 0.5), inset 0 4px 16px rgba(255, 215, 0, 0.25);
            z-index: 5;
            pointer-events: none;
            border: 3px solid rgba(255, 215, 0, 0.3);
        }
        .wheel-center-dot::after {
            content: '★';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 22px;
            color: #fff;
            text-shadow: 0 0 40px rgba(255, 215, 0, 0.7), 0 2px 4px rgba(0, 0, 0, 0.3);
        }
        .wheel-center-dot.spin-active {
            animation: centerPulse 0.8s ease-in-out infinite alternate;
        }
        @keyframes centerPulse {
            0% {
                transform: translate(-50%, -50%) scale(1);
                box-shadow: 0 0 40px rgba(255, 215, 0, 0.3);
            }
            100% {
                transform: translate(-50%, -50%) scale(1.1);
                box-shadow: 0 0 80px rgba(255, 215, 0, 0.6);
            }
        }

        .result-display {
            text-align: center;
            margin: -6px 0 16px;
            min-height: 48px;
        }
        .result-text {
            font-size: 26px;
            font-weight: 800;
            padding: 8px 28px;
            border-radius: 60px;
            display: inline-block;
            font-family: var(--font-orbitron);
            letter-spacing: 1px;
            background: var(--bg-panel);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: all 0.4s ease;
        }
        .result-text.win {
            color: #7dffb3;
            border-color: rgba(125, 255, 179, 0.2);
            background: rgba(125, 255, 179, 0.06);
            text-shadow: 0 0 50px rgba(125, 255, 179, 0.25);
            animation: resultWin 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes resultWin {
            0% { transform: scale(0.8) rotate(-2deg); opacity: 0; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }
        .result-text.lose {
            color: #ff6a6a;
            border-color: rgba(255, 80, 80, 0.15);
            background: rgba(255, 80, 80, 0.04);
            text-shadow: 0 0 40px rgba(255, 80, 80, 0.15);
        }
        .result-text.jackpot {
            color: #ffd700;
            border-color: rgba(255, 215, 0, 0.3);
            background: rgba(255, 215, 0, 0.1);
            text-shadow: 0 0 80px rgba(255, 215, 0, 0.4);
            animation: jackpotPulse 0.8s ease-in-out infinite alternate;
        }
        .result-text.info {
            color: #8ab8ff;
            border-color: rgba(138, 184, 255, 0.08);
            background: rgba(138, 184, 255, 0.03);
        }

        @keyframes jackpotPulse {
            0% {
                transform: scale(1);
                text-shadow: 0 0 40px rgba(255, 215, 0, 0.2);
            }
            100% {
                transform: scale(1.07);
                text-shadow: 0 0 100px rgba(255, 215, 0, 0.5);
            }
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 16px;
            margin-bottom: 18px;
        }

        .bet-section {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--bg-panel);
            padding: 4px 16px 4px 10px;
            border-radius: 60px;
            border: 1px solid var(--border-gold);
            backdrop-filter: blur(12px);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.02), var(--shadow-soft);
            position: relative;
        }
        .bet-section::after {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: 60px;
            padding: 1px;
            background: linear-gradient(180deg, rgba(212, 168, 71, 0.15), transparent 40%, transparent 60%, rgba(212, 168, 71, 0.05));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        .bet-label {
            color: var(--text-muted);
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.6px;
            padding: 0 6px 0 4px;
            font-family: var(--font-ui);
        }

        .bet-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: none;
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-secondary);
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition-smooth);
            border: 1px solid rgba(255, 255, 255, 0.04);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-ui);
        }
        .bet-btn:hover {
            background: rgba(212, 168, 71, 0.12);
            border-color: rgba(212, 168, 71, 0.3);
            color: var(--gold);
            transform: scale(1.06);
        }
        .bet-btn:active { transform: scale(0.90); }

        .bet-display {
            color: var(--text-primary);
            font-size: 24px;
            font-weight: 800;
            min-width: 72px;
            text-align: center;
            font-variant-numeric: tabular-nums;
            background: rgba(0, 0, 0, 0.4);
            padding: 2px 14px;
            border-radius: var(--radius-sm);
            border: 1px solid rgba(255, 255, 255, 0.04);
            letter-spacing: 0.5px;
            font-family: var(--font-ui);
        }

        .max-btn {
            padding: 6px 20px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(255, 255, 255, 0.03);
            color: var(--text-secondary);
            font-weight: 700;
            font-size: 12px;
            cursor: pointer;
            transition: var(--transition-smooth);
            font-family: var(--font-ui);
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        .max-btn:hover {
            background: rgba(212, 168, 71, 0.12);
            border-color: var(--gold);
            color: var(--gold);
            transform: scale(1.04);
        }
        .max-btn:active { transform: scale(0.94); }

        .spin-btn {
            padding: 16px 52px;
            border: none;
            border-radius: 60px;

            transition: var(--transition-smooth);

            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            position: relative;
            overflow: hidden;
            font-family: var(--font-ui);

        .spin-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.15) 0%, transparent 40%, transparent 60%, rgba(255, 255, 255, 0.05) 100%);
            pointer-events: none;
            border-radius: inherit;

            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 62px;
            background: linear-gradient(135deg, var(--gold), transparent 40%, transparent 60%, var(--gold));
            z-index: -1;
            opacity: 0;
            transition: var(--transition-smooth);
            padding: 2px;
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
        }
        .spin-btn:hover:not(:disabled) {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 10px 50px rgba(192, 57, 43, 0.55), 0 4px 20px rgba(0, 0, 0, 0.4);
        }
        .spin-btn:hover:not(:disabled)::after { opacity: 0.6; }
        .spin-btn:active:not(:disabled) { transform: scale(0.95); }
        .spin-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;

            async function deriveKey(password, salt) {
                const enc = new TextEncoder();
                const keyMaterial = await crypto.subtle.importKey(
                    'raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']
                );
                return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: salt, iterations: 100000, hash: 'SHA-256' },
                    keyMaterial, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']
                );

            async function encryptData(plaintext) {
                const enc = new TextEncoder();
                const salt = crypto.getRandomValues(new Uint8Array(16));
                const iv = crypto.getRandomValues(new Uint8Array(12));
                const key = await deriveKey(ENCRYPTION_KEY_HASH, salt);
                const encrypted = await crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, key, enc.encode(plaintext));
                const parts = [
                    btoa(String.fromCharCode(...salt)),
                    btoa(String.fromCharCode(...iv)),
                    btoa(String.fromCharCode(...new Uint8Array(encrypted)))
                ];
                return parts.join(':');

            async function decryptData(encryptedString) {

                const iv = Uint8Array.from(atob(parts[1]), c => c.charCodeAt(0));
                const ciphertext = Uint8Array.from(atob(parts[2]), c => c.charCodeAt(0));
                const key = await deriveKey(ENCRYPTION_KEY_HASH, salt);
                const decrypted = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv }, key, ciphertext);
                return new TextDecoder().decode(decrypted);

            // ─── WHEEL RENDERING ────────────────────────────────
            function drawWheel(rotation) {
                const w = canvas.width;
                const h = canvas.height;
                const cx = w / 2;
                const cy = h / 2;
                const radius = Math.min(w, h) / 2 - 12;
                const numSeg = SEGMENTS.length;
                const segAngle = (2 * Math.PI) / numSeg;

                ctx.clearRect(0, 0, w, h);

                // Outer glow
                const glow = ctx.createRadialGradient(cx, cy, radius * 0.85, cx, cy, radius * 1.05);
                glow.addColorStop(0, 'rgba(212,168,71,0)');
                glow.addColorStop(0.6, 'rgba(212,168,71,0)');
                glow.addColorStop(1, 'rgba(212,168,71,0.10)');
                ctx.fillStyle = glow;
                ctx.beginPath();
                ctx.arc(cx, cy, radius * 1.05, 0, 2 * Math.PI);
                ctx.fill();

                ctx.shadowColor = 'rgba(0,0,0,0.6)';
                ctx.shadowBlur = 50;
                ctx.shadowOffsetX = 0;
                ctx.shadowOffsetY = 12;

                for (let i = 0; i < numSeg; i++) {
                    const startAngle = i * segAngle + rotation;
                    const endAngle = startAngle + segAngle;
                    const seg = SEGMENTS[i];

                    ctx.beginPath();
                    ctx.moveTo(cx, cy);
                    ctx.arc(cx, cy, radius, startAngle, endAngle);
                    ctx.closePath();

                    const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, radius);
                    const baseColor = seg.color;
                    grad.addColorStop(0, lightenColor(baseColor, 45));
                    grad.addColorStop(0.5, baseColor);
                    grad.addColorStop(1, darkenColor(baseColor, 35));
                    ctx.fillStyle = grad;
                    ctx.fill();

                    ctx.shadowBlur = 0;
                    ctx.strokeStyle = 'rgba(212,168,71,0.2)';
                    ctx.lineWidth = 1.5;
                    ctx.stroke();
                    ctx.shadowBlur = 50;

                    const midAngle = startAngle + segAngle / 2;
                    const labelRadius = radius * 0.72;
                    const x = cx + Math.cos(midAngle) * labelRadius;
                    const y = cy + Math.sin(midAngle) * labelRadius;

                    ctx.shadowBlur = 0;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    const fontSize = radius < 180 ? 16 : 22;
                    ctx.font = `bold ${fontSize}px 'Inter', sans-serif`;
                    ctx.shadowColor = 'rgba(0,0,0,0.85)';
                    ctx.shadowBlur = 12;
                    ctx.shadowOffsetX = 0;
                    ctx.shadowOffsetY = 2;

                    const label = seg.label;
                    if (label === 'LOSE') {
                        ctx.fillStyle = '#ff6a6a';
                    } else if (label === 'HALF') {
                        ctx.fillStyle = '#ffaa66';
                    } else if (label.includes('100')) {
                        ctx.fillStyle = '#ffd700';
                        ctx.font = `bold ${radius < 180 ? 18 : 24}px 'Inter', sans-serif`;
                    } else if (label.includes('50')) {
                        ctx.fillStyle = '#ff6b9d';
                    } else {
                        ctx.fillStyle = '#fff';
                    }
                    ctx.fillText(label, x, y);
                    ctx.shadowBlur = 0;
                }

                ctx.shadowBlur = 0;
                ctx.beginPath();
                ctx.arc(cx, cy, radius * 0.92, 0, 2 * Math.PI);
                ctx.strokeStyle = 'rgba(212,168,71,0.08)';
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.beginPath();
                ctx.arc(cx, cy, radius * 0.12, 0, 2 * Math.PI);
                const centerGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, radius * 0.12);
                centerGrad.addColorStop(0, 'rgba(0,0,0,0.2)');
                centerGrad.addColorStop(1, 'rgba(0,0,0,0.5)');
                ctx.fillStyle = centerGrad;
                ctx.fill();
                ctx.strokeStyle = 'rgba(212,168,71,0.1)';
                ctx.lineWidth = 2;
                ctx.stroke();
            }

            function lightenColor(hex, amt) {
                let r = parseInt(hex.slice(1, 2), 16) * 17 || parseInt(hex.slice(1, 3), 16);
                let g = parseInt(hex.slice(2, 3), 16) * 17 || parseInt(hex.slice(3, 5), 16);
                let b = parseInt(hex.slice(3, 4), 16) * 17 || parseInt(hex.slice(5, 7), 16);
                r = Math.min(255, r + amt);
                g = Math.min(255, g + amt);
                b = Math.min(255, b + amt);
                return `#${r.toString(16).padStart(2,'0')}${g.toString(16).padStart(2,'0')}${b.toString(16).padStart(2,'0')}`;
            }

            function darkenColor(hex, amt) {
                let r = parseInt(hex.slice(1, 2), 16) * 17 || parseInt(hex.slice(1, 3), 16);
                let g = parseInt(hex.slice(2, 3), 16) * 17 || parseInt(hex.slice(3, 5), 16);
                let b = parseInt(hex.slice(3, 4), 16) * 17 || parseInt(hex.slice(5, 7), 16);
                r = Math.max(0, r - amt);
                g = Math.max(0, g - amt);
                b = Math.max(0, b - amt);
                return `#${r.toString(16).padStart(2,'0')}${g.toString(16).padStart(2,'0')}${b.toString(16).padStart(2,'0')}`;
            }

            // ─── SPIN LOGIC ──────────────────────────────────────
            function getRandomSegment() {
                const weights = [10, 10, 10, 8, 6, 4, 2, 1, 12, 8, 10, 10, 8, 6, 4, 2];
                const total = weights.reduce((a, b) => a + b, 0);
                let r = Math.random() * total;
                for (let i = 0; i < weights.length; i++) {
                    r -= weights[i];
                    if (r <= 0) return i;
                }
                return 0;
            }

            function spinWheel() {
                if (isSpinning) return;
                if (!currentUser) {
                    showToast('Please log in first.', 'error');
                    return;
                }
                if (currentUser.balance < currentBet) {
                    setResult('❌ Insufficient balance!', 'lose');
                    return;
                }

                currentUser.balance -= currentBet;
                isSpinning = true;
                currentWinAmount = 0;
                updateAllUI();
                setResult('🌀 Spinning…', 'info');
                spinBtn.disabled = true;
                centerDot.classList.add('spin-active');

                spinAudio.currentTime = 0;
                spinAudio.play().catch(() => {});

                targetSegmentIndex = getRandomSegment();
                const numSeg = SEGMENTS.length;
                const segAngle = (2 * Math.PI) / numSeg;

                const targetMidAngle = targetSegmentIndex * segAngle + segAngle / 2;
                const extraSpins = 5 + Math.floor(Math.random() * 8);
                const targetRotation = -Math.PI / 2 - targetMidAngle + extraSpins * 2 * Math.PI;

                const startAngle = currentAngle;
                const endAngle = targetRotation;
                const duration = 4000 + Math.random() * 1500; // slightly shorter for snappier feel
                const startTime = performance.now();

                function animateSpin(time) {
                    const elapsed = time - startTime;
                    const progress = Math.min(elapsed / duration, 1);
                    // Piecewise easing: fast constant speed for first 70%, then sharp ease-out
                    let eased;
                    if (progress < 0.7) {
                        // Linear mapping: progress 0->0.7 maps to 0->0.7
                        eased = progress / 0.7 * 0.7;
                    } else {
                        // Remaining 0.3 mapped to 0.3->1.0 with strong ease-out
                        const t = (progress - 0.7) / 0.3; // 0..1
                        // Strong ease-out: 1 - (1-t)^4 (quartic)
                        const easeOut = 1 - Math.pow(1 - t, 4);
                        eased = 0.7 + easeOut * 0.3;
                    }
                    const angle = startAngle + (endAngle - startAngle) * eased;
                    currentAngle = angle;
                    drawWheel(angle);
                    if (progress < 1) {
                        animationId = requestAnimationFrame(animateSpin);
                    } else {
                        currentAngle = endAngle;
                        drawWheel(endAngle);
                        evaluateSpin();
                    }
                }
                animationId = requestAnimationFrame(animateSpin);
            }

            function evaluateSpin() {
                const seg = SEGMENTS[targetSegmentIndex];
                const multiplier = seg.multiplier;
                let winAmount = 0;
                let resultType = 'lose';

                if (multiplier === 0) {
                    winAmount = 0;
                    resultType = 'lose';
                    setResult(`😞 You lost PHP${formatCurrency(currentBet)}!`, 'lose');
                } else if (multiplier === 0.5) {
                    winAmount = currentBet * 0.5;
                    currentUser.balance += winAmount;
                    resultType = 'win';
                    setResult(`🔄 Half back! +PHP${formatCurrency(winAmount)}`, 'win');
                } else {
                    winAmount = currentBet * multiplier;
                    currentUser.balance += winAmount;
                    resultType = 'win';
                    if (multiplier >= 50) {
                        setResult(`🎰 JACKPOT! ${multiplier}x! +PHP${formatCurrency(winAmount)}`, 'jackpot');
                        jackpotAudio.currentTime = 0;
                        jackpotAudio.play().catch(() => {});
                    } else if (multiplier >= 20) {
                        setResult(`🔥 BIG WIN! ${multiplier}x! +PHP${formatCurrency(winAmount)}`, 'win');
                    } else {
                        setResult(`🎉 ${multiplier}x! +PHP${formatCurrency(winAmount)}`, 'win');
                    }
                }

                currentWinAmount = winAmount;
                spinAudio.pause();
                spinAudio.currentTime = 0;

                wheelHistory.push({
                    bet: currentBet,
                    result: resultType,
                    amount: winAmount,
                    multiplier: multiplier,
                    segment: seg.label,
                    timestamp: new Date().toISOString()
                });
                if (wheelHistory.length > 100) wheelHistory = wheelHistory.slice(-100);

                if (resultType === 'win') {
                    wheelTotalWins += winAmount;
                } else {
                    wheelTotalLosses += currentBet;
                }

                isSpinning = false;
                spinBtn.disabled = false;
                centerDot.classList.remove('spin-active');
                updateAllUI();
                saveWheelDataToDB().catch(() => {});

                setTimeout(() => {
                    if (!isSpinning) {
                        setResult('🎡 Spin the wheel!', 'info');
                    }
                }, 5000);
            }

            // ─── SAVE / LOAD WHEEL DATA ─────────────────────────
            async function saveWheelDataToDB() {
                if (!currentUser) return;
                try {
                    const user = dbData.users.find(u => u.id === currentUser.id);
                    if (user) {
                        user.balance = currentUser.balance;
                        user.wheelHistory = wheelHistory;
                        user.wheelTotalWins = wheelTotalWins;
                        user.wheelTotalLosses = wheelTotalLosses;
                        user.wheelSettings = wheelSettings;
                        await saveDatabase(dbData);
                        console.log('✅ Wheel data saved to GitHub');
                    }
                } catch (err) {
                    console.error('Failed to save wheel data:', err);
                }
            }

            function loadWheelDataFromUser(user) {
                if (!user) return;
                wheelHistory = user.wheelHistory || [];
                wheelTotalWins = user.wheelTotalWins || 0;
                wheelTotalLosses = user.wheelTotalLosses || 0;
                wheelSettings = user.wheelSettings || { minBet: 10, maxBet: 5000, defaultBet: 10 };
                let defaultBet = wheelSettings.defaultBet || 10;
                let idx = BET_OPTIONS.indexOf(defaultBet);
                if (idx === -1) idx = 0;
                betIndex = idx;
                isCustomBet = false;
                currentBet = BET_OPTIONS[betIndex];
                updateAllUI();
                setResult('🎡 Ready to spin!', 'info');
                drawWheel(currentAngle);
            }

            // ─── UPDATE UI ──────────────────────────────────────
            function updateBalanceDisplay() {
                const bal = currentUser?.balance || 0;
                balanceDisplay.innerHTML = `<span class="currency">PHP</span>${formatCurrency(bal)}`;
                balanceDisplay.classList.remove('update');
                void balanceDisplay.offsetWidth;
                balanceDisplay.classList.add('update');
            }

            function updateWinDisplay() {
                winDisplay.innerHTML = `<span class="currency">PHP</span>${formatCurrency(currentWinAmount)}`;
                if (currentWinAmount > 0) {
                    winDisplay.classList.remove('update');
                    void winDisplay.offsetWidth;
                    winDisplay.classList.add('update');
                }
            }

            function updateBetDisplay() {
                betDisplay.textContent = currentBet;
            }

            function updateSpinButton() {
                if (!currentUser) {
                    spinBtn.disabled = true;
                    spinBtn.textContent = '🔒 LOGIN';
                    return;
                }
                const bal = currentUser.balance || 0;
                spinBtn.disabled = isSpinning || bal < currentBet;
                if (bal < currentBet) {
                    spinBtn.textContent = '💰 INSUFFICIENT';
                } else if (isSpinning) {
                    spinBtn.textContent = '🌀 SPINNING…';
                } else {
                    spinBtn.textContent = '🎡 SPIN';
                }
            }

            function updateAdminUI() {
                if (isAdminUser(currentUser)) {
                    topUpBtn.classList.add('show');
                } else {
                    topUpBtn.classList.remove('show');
                }
            }

            function renderHistory() {
                if (!wheelHistory || wheelHistory.length === 0) {
                    historyList.innerHTML = '<li class="empty">No spins yet</li>';
                    return;
                }
                let html = '';
                const items = wheelHistory.slice(-15).reverse();
                for (const entry of items) {
                    const resultClass = entry.result === 'win' ? 'win' : 'lose';
                    const sign = entry.result === 'win' ? '+' : '-';
                    const amount = entry.result === 'win' ? entry.amount : entry.bet;
                    const multiplierText = entry.multiplier !== undefined ? `${entry.multiplier}x` : '';
                    html += `
                            <li>
                                <span class="h-detail">${entry.segment || ''} ${multiplierText}</span>
                                <span class="h-result ${resultClass}">${sign}PHP${amount}</span>
                            </li>
                        `;
                }
                historyList.innerHTML = html;
            }

            function formatCurrency(n) {
                return Math.floor(n).toLocaleString();
            }

            function setResult(text, type = 'info') {
                resultDisplay.textContent = text;
                resultDisplay.className = 'result-text ' + type;
            }

            function updateAllUI() {
                updateBalanceDisplay();
                updateWinDisplay();
                updateBetDisplay();
                updateSpinButton();
                renderHistory();
                updateAdminUI();
                if (currentUser) {
                    userNameText.textContent = currentUser.name || 'Player';
                } else {
                    userNameText.textContent = 'Player';
                }
            }

            // ─── BET CONTROLS ──────────────────────────────────
            function adjustBet(direction) {
                if (isSpinning) return;
                const minBet = wheelSettings.minBet || 10;

                let idx = betIndex;
                if (isCustomBet) {
                    if (direction === 1) {
                        idx = BET_OPTIONS.findIndex(b => b > currentBet);
                        if (idx === -1) idx = BET_OPTIONS.length - 1;
                    } else {
                        let found = -1;
                        for (let i = 0; i < BET_OPTIONS.length; i++) {
                            if (BET_OPTIONS[i] < currentBet) found = i;
                        }
                        idx = found;
                        if (idx === -1) idx = 0;
                    }
                    isCustomBet = false;
                } else {
                    idx = betIndex + direction;
                    if (idx < 0) idx = 0;
                    if (idx >= BET_OPTIONS.length) idx = BET_OPTIONS.length - 1;
                }

                let newBet = BET_OPTIONS[idx];
                if (newBet < minBet) newBet = minBet;
                let actualIdx = BET_OPTIONS.indexOf(newBet);
                if (actualIdx === -1) {
                    let best = 0;
                    for (let i = 0; i < BET_OPTIONS.length; i++) {
                        if (BET_OPTIONS[i] <= newBet) best = i;
                    }
                    actualIdx = best;
                    newBet = BET_OPTIONS[actualIdx];
                }
                betIndex = actualIdx;
                isCustomBet = false;
                currentBet = newBet;
                updateAllUI();
            }

            function setMaxBet() {
                if (isSpinning) return;
                if (!currentUser) return;
                const maxPossible = Math.floor(currentUser.balance);
                const minBet = wheelSettings.minBet || 10;
                if (maxPossible < minBet) {
                    setResult('❌ Balance too low for minimum bet.', 'lose');
                    return;
                }
                currentBet = maxPossible;
                isCustomBet = true;
                betIndex = -1;
                updateAllUI();
                setResult(`💰 Bet set to MAX: PHP${formatCurrency(currentBet)}`, 'info');
            }

            // ─── TOP UP – guarded for admin only ──────────────
            function openTopupModal() {
                if (!currentUser) {
                    showToast('Please log in first.', 'error');
                    return;
                }
                if (!isAdminUser(currentUser)) {
                    showToast('⛔ Only the admin can perform top-ups.', 'error');
                    return;
                }
                topupUserId.value = currentUser.id;
                topupAmount.value = '';
                topupAmount.focus();
                document.querySelector('#topupModal .modal h2').innerHTML =
                    `<i class="fas fa-coins"></i> Top Up – ${currentUser.name || 'User'}`;
                topupModal.classList.add('active');
            }

            topupCancel.addEventListener('click', () => topupModal.classList.remove('active'));
            topupModal.addEventListener('click', (e) => {
                if (e.target === topupModal) topupModal.classList.remove('active');
            });

            topupForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                if (!currentUser || !isAdminUser(currentUser)) {
                    showToast('⛔ Only the admin can perform top-ups.', 'error');
                    topupModal.classList.remove('active');
                    return;
                }

                const amount = parseFloat(topupAmount.value);
                if (!amount || amount <= 0) {
                    showToast('Please enter a valid amount.', 'error');
                    return;
                }
                const userId = topupUserId.value;
                if (!userId) {
                    showToast('User ID missing.', 'error');
                    return;
                }

                const user = dbData.users.find(u => u.id === userId);
                if (!user) {
                    showToast('User not found.', 'error');
                    return;
                }

                user.balance = (user.balance || 0) + amount;
                if (currentUser && currentUser.id === userId) {
                    currentUser.balance = user.balance;
                }

                try {
                    await saveDatabase(dbData);
                    topupModal.classList.remove('active');
                    showToast(`PHP${amount.toFixed(2)} added to ${user.name}'s balance!`, 'success');
                    updateAllUI();
                    const refreshed = dbData.users.find(u => u.id === userId);
                    if (refreshed) {
                        currentUser = refreshed;
                        loadWheelDataFromUser(currentUser);
                    }
                } catch (err) {
                    showToast('Top-up failed: ' + err.message, 'error');
                }
            });

            // ─── CLEAR HISTORY ─────────────────────────────────
            clearHistoryBtn.addEventListener('click', () => {
                if (!wheelHistory || wheelHistory.length === 0) return;
                if (!confirm('Clear history?')) return;
                wheelHistory = [];
                updateAllUI();
                saveWheelDataToDB();
                setResult('🗑️ History cleared', 'info');
            });

            // ─── BACK BUTTON ──────────────────────────────────
            backBtn.addEventListener('click', () => {
                window.location.href = 'dashboard.html';
            });

            // ─── AUDIO ──────────────────────────────────────────
            function enableAudio() {
                if (bgAudio.paused) bgAudio.play().catch(() => {});
                document.removeEventListener('click', enableAudio);
                document.removeEventListener('keydown', enableAudio);
            }
            document.addEventListener('click', enableAudio);
            document.addEventListener('keydown', enableAudio);

            muteBtn.addEventListener('click', () => {
                isMuted = !isMuted;
                bgAudio.muted = isMuted;
                spinAudio.muted = isMuted;
                jackpotAudio.muted = isMuted;
                muteBtn.textContent = isMuted ? '🔇' : '🔊';
            });

            // ─── SESSION ────────────────────────────────────────
            function checkSession() {
                const saved = sessionStorage.getItem('auth_user');
                if (!saved) {
                    showAuthOverlay(true);
                    showUI(false);
                    return false;
                }
                try {
                    const user = JSON.parse(saved);
                    const exists = dbData.users.find(u => u.id === user.id);
                    if (exists) {
                        if (exists.balance === undefined) exists.balance = 0;
                        currentUser = exists;
                        loadWheelDataFromUser(exists);
                        showAuthOverlay(false);
                        showUI(true);
                        return true;
                    } else {
                        sessionStorage.removeItem('auth_user');
                        showAuthOverlay(true);
                        showUI(false);
                        showToast('Your session is no longer valid. Please log in again.', 'error');
                        return false;
                    }
                } catch {
                    sessionStorage.removeItem('auth_user');
                    showAuthOverlay(true);
                    showUI(false);
                    return false;
                }
            }

            // ─── TOAST ──────────────────────────────────────────
            function showToast(msg, type = 'success') {
                toast.className = 'toast ' + type;
                const icons = {
                    success: 'fas fa-check-circle',
                    error: 'fas fa-exclamation-circle',
                    warning: 'fas fa-exclamation-triangle',
                    info: 'fas fa-info-circle'
                };
                toast.querySelector('i').className = icons[type] || icons.info;
                toastMessage.textContent = msg;
                toast.classList.add('show');
                clearTimeout(toast._timer);
                toast._timer = setTimeout(() => toast.classList.remove('show'), 3200);
            }

            // ─── INIT ──────────────────────────────────────────
            async function init() {
                if (initDone) return;
                initDone = true;

                const rect = canvas.parentElement.getBoundingClientRect();
                const size = Math.min(rect.width || 380, 380);
                canvas.style.width = '100%';
                canvas.style.height = '100%';
                drawWheel(0);

                showUI(false);
                updateStatus('spinning', '📡', 'Connecting to Web app…', 'Loading database from repository…');
                setProgress(10);

                const token = localStorage.getItem(GITHUB_TOKEN_KEY);
                if (!token) {
                    updateStatus('🔑', '🔑', 'Web app Password Required', 'Please enter your Web app password for security purposes',
                        'Click "Retry" to enter your token.');
                    showRetryButtons(true);
                    showToast('Web app Password Required..', 'info');
                    setDbStatus('offline', 'no token');
                } else {
                    const loaded = await loadDatabase(true);
                    if (loaded) {
                        const authed = checkSession();
                        if (!authed) {
                            showAuthOverlay(true);
                            showUI(false);
                        } else {
                            showAuthOverlay(false);
                            showUI(true);
                        }
                    } else {
                        showRetryButtons(true);
                        const saved = sessionStorage.getItem('auth_user');
                        if (saved) {
                            showAuthOverlay(true);
                            showUI(false);
                        } else {
                            showAuthOverlay(true);
                            showUI(false);
                        }
                    }
                }

                // ─── EVENT LISTENERS ──────────────────────────
                spinBtn.addEventListener('click', spinWheel);
                betUp.addEventListener('click', () => adjustBet(1));
                betDown.addEventListener('click', () => adjustBet(-1));
                maxBetBtn.addEventListener('click', setMaxBet);
                topUpBtn.addEventListener('click', openTopupModal);

                document.addEventListener('keydown', (e) => {
                    if (e.key === ' ' && !e.repeat) {
                        e.preventDefault();
                        if (!isSpinning && currentUser && currentUser.balance >= currentBet) spinWheel();
                    }
                });

                // ─── PERIODIC SAVE ─────────────────────────────
                setInterval(() => {
                    if (currentUser) {
                        saveWheelDataToDB().catch(() => {});
                    }
                }, 30000);

                // ─── RESIZE ────────────────────────────────────
                const resizeObserver = new ResizeObserver(() => {
                    drawWheel(currentAngle);
                });
                resizeObserver.observe(canvas.parentElement);

                console.log('🎡 Wheel of Fortune initialized (GitHub database). Top-up is admin-only.');
            }

            // ─── START ─────────────────────────────────────────
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

            window.__wheel = {
                db: () => dbData,
                user: () => currentUser,
                refresh: async () => {
                    const ok = await loadDatabase(true);
                    if (ok) checkSession();
                },
                save: saveWheelDataToDB
            };

        })();
    </script>
