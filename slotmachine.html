<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>🎰 ArvRoyal Spin – Casino Slot</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <style>
        /* ─── CSS CUSTOM PROPERTIES – THEME ─── */
        :root {
            --gold: #d4a847;
            --gold-light: #f0d080;
            --gold-dark: #b8923a;
            --gold-pale: #e8d5a3;
            --gold-gradient: linear-gradient(135deg, #f0d080 0%, #d4a847 30%, #c99a3a 55%, #b8923a 75%, #d4a847 100%);
            --gold-gradient-soft: linear-gradient(135deg, #f6e6b3 0%, #d4a847 50%, #b8923a 100%);
            --ruby-gradient: linear-gradient(135deg, #e74c3c, #c0392b, #a93226);
            --ruby-glow: 0 0 40px rgba(192, 57, 43, 0.3);
            --bg-primary: #06060e;
            --bg-secondary: #0c0a18;
            --bg-panel: rgba(20, 18, 30, 0.8);
            --bg-card: rgba(255, 255, 255, 0.04);
            --text-primary: #f5f0e8;
            --text-secondary: #b8aa9a;
            --text-muted: #6a5f55;
            --border-gold: rgba(212, 168, 71, 0.3);
            --border-glow: rgba(212, 168, 71, 0.15);
            --shadow-heavy: 0 30px 80px rgba(0, 0, 0, 0.95), 0 8px 32px rgba(0, 0, 0, 0.6);
            --shadow-soft: 0 8px 32px rgba(0, 0, 0, 0.5);
            --shadow-gold: 0 0 60px rgba(212, 168, 71, 0.08);
            --radius-xl: 48px;
            --radius-lg: 28px;
            --radius-md: 16px;
            --radius-sm: 10px;
            --radius-xs: 6px;
            --transition-smooth: 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-bounce: 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            --font-display: 'Playfair Display', serif;
            --font-ui: 'Inter', system-ui, -apple-system, sans-serif;
            --font-orbitron: 'Orbitron', monospace;
            --font-rajdhani: 'Rajdhani', sans-serif;
        }

        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html {
            -webkit-tap-highlight-color: transparent;
        }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--bg-primary);
            font-family: var(--font-ui);
            padding: 16px;
            position: relative;
            overflow-x: hidden;
        }

        /* ─── BODY BACKGROUND LAYERS ─── */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse at 30% 20%, rgba(212, 168, 71, 0.06) 0%, transparent 55%),
                radial-gradient(ellipse at 70% 80%, rgba(192, 57, 43, 0.05) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(10, 8, 20, 0.8) 0%, var(--bg-primary) 100%);
            pointer-events: none;
            z-index: 0;
        }

        /* ─── ANIMATED SPARKLE GRID ─── */
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                radial-gradient(1px 1px at 5% 15%, rgba(212, 168, 71, 0.20), transparent),
                radial-gradient(1px 1px at 15% 45%, rgba(212, 168, 71, 0.12), transparent),
                radial-gradient(1px 1px at 25% 75%, rgba(212, 168, 71, 0.18), transparent),
                radial-gradient(1px 1px at 35% 10%, rgba(212, 168, 71, 0.10), transparent),
                radial-gradient(1px 1px at 45% 55%, rgba(212, 168, 71, 0.15), transparent),
                radial-gradient(1px 1px at 55% 30%, rgba(212, 168, 71, 0.08), transparent),
                radial-gradient(1px 1px at 65% 85%, rgba(212, 168, 71, 0.20), transparent),
                radial-gradient(1px 1px at 75% 5%, rgba(212, 168, 71, 0.12), transparent),
                radial-gradient(1px 1px at 85% 50%, rgba(212, 168, 71, 0.18), transparent),
                radial-gradient(1px 1px at 95% 70%, rgba(212, 168, 71, 0.10), transparent),
                radial-gradient(1px 1px at 10% 90%, rgba(212, 168, 71, 0.15), transparent),
                radial-gradient(1px 1px at 50% 95%, rgba(212, 168, 71, 0.12), transparent),
                radial-gradient(1px 1px at 90% 25%, rgba(212, 168, 71, 0.14), transparent);
            background-size: 180px 180px;
            pointer-events: none;
            z-index: 0;
            animation: sparkleFloat 18s linear infinite;
            opacity: 0.7;
        }

        @keyframes sparkleFloat {
            0% {
                transform: translateY(0) scale(1);
                opacity: 0.5;
            }
            33% {
                opacity: 0.9;
            }
            66% {
                opacity: 0.6;
            }
            100% {
                transform: translateY(-80px) scale(1.15);
                opacity: 0.5;
            }
        }

        /* ─── FLOATING GOLD PARTICLES ─── */
        .particles-container {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: var(--gold);
            border-radius: 50%;
            opacity: 0;
            animation: particleRise 8s ease-in infinite;
            box-shadow: 0 0 6px rgba(212, 168, 71, 0.4);
        }
        .particle:nth-child(1) {
            left: 8%;
            animation-delay: 0s;
            animation-duration: 9s;
        }
        .particle:nth-child(2) {
            left: 18%;
            animation-delay: 2.2s;
            animation-duration: 11s;
        }
        .particle:nth-child(3) {
            left: 28%;
            animation-delay: 4.5s;
            animation-duration: 8s;
        }
        .particle:nth-child(4) {
            left: 38%;
            animation-delay: 1.2s;
            animation-duration: 10s;
        }
        .particle:nth-child(5) {
            left: 48%;
            animation-delay: 3.8s;
            animation-duration: 12s;
        }
        .particle:nth-child(6) {
            left: 58%;
            animation-delay: 0.8s;
            animation-duration: 9.5s;
        }
        .particle:nth-child(7) {
            left: 68%;
            animation-delay: 5.2s;
            animation-duration: 8.5s;
        }
        .particle:nth-child(8) {
            left: 78%;
            animation-delay: 2.8s;
            animation-duration: 10.5s;
        }
        .particle:nth-child(9) {
            left: 88%;
            animation-delay: 4.0s;
            animation-duration: 11.5s;
        }
        .particle:nth-child(10) {
            left: 95%;
            animation-delay: 1.8s;
            animation-duration: 9.8s;
        }
        .particle:nth-child(11) {
            left: 12%;
            animation-delay: 3.2s;
            animation-duration: 10.2s;
        }
        .particle:nth-child(12) {
            left: 42%;
            animation-delay: 5.8s;
            animation-duration: 8.8s;
        }
        .particle:nth-child(13) {
            left: 62%;
            animation-delay: 0.5s;
            animation-duration: 9.2s;
        }
        .particle:nth-child(14) {
            left: 82%;
            animation-delay: 4.8s;
            animation-duration: 10.8s;
        }
        .particle:nth-child(15) {
            left: 52%;
            animation-delay: 2.5s;
            animation-duration: 11.2s;
        }

        @keyframes particleRise {
            0% {
                transform: translateY(100vh) scale(0.5);
                opacity: 0;
            }
            10% {
                opacity: 0.8;
            }
            90% {
                opacity: 0.8;
            }
            100% {
                transform: translateY(-20vh) scale(1.2);
                opacity: 0;
            }
        }

        /* ─── SLOT MACHINE CABINET ─── */
        .slot-machine {
            position: relative;
            z-index: 1;
            max-width: 860px;
            width: 100%;
            background:
                linear-gradient(175deg, #1e1612 0%, #0d0a08 35%, #080507 70%, #050308 100%);
            border-radius: var(--radius-xl);
            padding: 32px 30px 34px;
            box-shadow:
                0 40px 100px rgba(0, 0, 0, 0.95),
                0 0 0 1px rgba(212, 168, 71, 0.08),
                inset 0 1px 0 rgba(255, 255, 255, 0.05),
                inset 0 -2px 0 rgba(0, 0, 0, 0.9),
                var(--shadow-gold);
            backdrop-filter: blur(4px);
            transition: var(--transition-smooth);
            border: 1px solid rgba(212, 168, 71, 0.10);
        }

        /* ─── CABINET TOP GLOW BAR ─── */
        .slot-machine::before {
            content: '';
            position: absolute;
            top: -1px;
            left: 30px;
            right: 30px;
            height: 4px;
            background: linear-gradient(90deg,
                    transparent,
                    rgba(212, 168, 71, 0.1) 10%,
                    var(--gold) 40%,
                    #ffd700 50%,
                    var(--gold) 60%,
                    rgba(212, 168, 71, 0.1) 90%,
                    transparent);
            border-radius: 0 0 50% 50%;
            opacity: 0.7;
            filter: blur(0.5px);
            box-shadow: 0 0 30px rgba(212, 168, 71, 0.15);
        }

        .slot-machine::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 50px;
            right: 50px;
            height: 2px;
            background: linear-gradient(90deg,
                    transparent,
                    rgba(212, 168, 71, 0.15) 20%,
                    rgba(212, 168, 71, 0.3) 50%,
                    rgba(212, 168, 71, 0.15) 80%,
                    transparent);
            border-radius: 50% 50% 0 0;
            opacity: 0.6;
        }

        /* ─── CABINET METALLIC EDGE ─── */
        .slot-machine .cabinet-edge {
            position: absolute;
            inset: 6px;
            border-radius: calc(var(--radius-xl) - 6px);
            border: 1px solid rgba(212, 168, 71, 0.04);
            pointer-events: none;
            box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.6);
        }

        .slot-machine .corner-gem {
            position: absolute;
            width: 14px;
            height: 14px;
            background: var(--gold-gradient);
            clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
            opacity: 0.5;
            filter: blur(0.5px);
            box-shadow: 0 0 12px rgba(212, 168, 71, 0.2);
        }
        .slot-machine .corner-gem.tl {
            top: 14px;
            left: 20px;
        }
        .slot-machine .corner-gem.tr {
            top: 14px;
            right: 20px;
        }
        .slot-machine .corner-gem.bl {
            bottom: 14px;
            left: 20px;
        }
        .slot-machine .corner-gem.br {
            bottom: 14px;
            right: 20px;
        }

        /* ─── TOP BAR ─── */
        .cabinet-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 22px;
            flex-wrap: wrap;
            gap: 12px;
            position: relative;
            z-index: 2;
        }
        .top-left {
            display: flex;
            align-items: center;
            gap: 18px;
            flex-wrap: wrap;
        }
        .title {
            font-family: var(--font-display);
            font-size: 36px;
            font-weight: 900;
            font-style: italic;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: none;
            filter: drop-shadow(0 0 30px rgba(212, 168, 71, 0.10));
            letter-spacing: 0.5px;
            line-height: 1;
            position: relative;
        }
        .title .icon {
            -webkit-text-fill-color: initial;
            color: #f0d080;
            margin-right: 2px;
        }
        .title::after {
            content: '✦';
            font-size: 10px;
            -webkit-text-fill-color: initial;
            color: var(--gold);
            position: absolute;
            top: -2px;
            right: -24px;
            opacity: 0.3;
            font-style: normal;
            animation: twinkle 3s ease-in-out infinite;
        }
        @keyframes twinkle {
            0%,
            100% {
                opacity: 0.3;
                transform: scale(1);
            }
            50% {
                opacity: 0.8;
                transform: scale(1.2);
            }
        }

        .user-name {
            font-family: var(--font-ui);
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            background: var(--bg-panel);
            padding: 5px 18px;
            border-radius: 40px;
            border: 1px solid var(--border-gold);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.02);
        }
        .user-name i {
            color: var(--gold);
            font-size: 12px;
        }
        .user-name .user-badge {
            font-size: 9px;
            background: rgba(212, 168, 71, 0.12);
            color: var(--gold-light);
            padding: 0 8px;
            border-radius: 20px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .top-right {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .stats {
            display: flex;
            gap: 18px;
            background: var(--bg-panel);
            padding: 6px 22px 6px 26px;
            border-radius: 60px;
            border: 1px solid var(--border-gold);
            backdrop-filter: blur(12px);
            align-items: center;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.03), var(--shadow-soft);
            flex-wrap: wrap;
            justify-content: center;
        }
        .stat {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2px 0;
            position: relative;
        }
        .stat:not(:last-child)::after {
            content: '';
            position: absolute;
            right: -10px;
            top: 15%;
            height: 70%;
            width: 1px;
            background: linear-gradient(to bottom, transparent, rgba(212, 168, 71, 0.12), transparent);
        }
        .stat .label {
            font-size: 8px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-muted);
            font-family: var(--font-ui);
        }
        .stat .value {
            font-size: 22px;
            font-weight: 800;
            color: var(--text-primary);
            min-width: 72px;
            text-align: center;
            font-variant-numeric: tabular-nums;
            letter-spacing: 0.5px;
            transition: color 0.3s;
            font-family: var(--font-ui);
        }
        .value.balance {
            color: #7dffb3;
            text-shadow: 0 0 30px rgba(125, 255, 179, 0.12);
        }
        .value.win {
            color: var(--gold-light);
            text-shadow: 0 0 30px rgba(212, 168, 71, 0.15);
        }
        .value.balance.danger {
            color: #ff6a6a;
            text-shadow: 0 0 30px rgba(255, 80, 80, 0.15);
        }
        .stat .value .currency {
            font-size: 13px;
            opacity: 0.5;
            margin-right: 2px;
        }

        .mute-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            color: var(--text-secondary);
            font-size: 18px;
            border-radius: 30px;
            padding: 4px 10px;
            cursor: pointer;
            transition: var(--transition-smooth);
            backdrop-filter: blur(4px);
            line-height: 1;
        }
        .mute-btn:hover {
            background: rgba(212, 168, 71, 0.08);
            border-color: var(--gold);
            color: var(--gold);
            transform: scale(1.05);
        }
        .mute-btn:active {
            transform: scale(0.92);
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            color: var(--text-secondary);
            padding: 6px 16px;
            border-radius: 30px;
            cursor: pointer;
            transition: var(--transition-smooth);
            font-family: var(--font-ui);
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            backdrop-filter: blur(4px);
        }
        .back-btn:hover {
            background: rgba(212, 168, 71, 0.08);
            border-color: var(--gold);
            color: var(--gold);
            transform: scale(1.03);
        }
        .back-btn:active {
            transform: scale(0.94);
        }

        .db-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.15);
            padding: 4px 12px;
            border-radius: 100px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.03);
            font-family: var(--font-ui);
        }
        .db-status i {
            font-size: 0.55rem;
        }
        .db-status.online i {
            color: #34d399;
        }
        .db-status.offline i {
            color: #f87171;
        }
        .db-status .status-label {
            color: rgba(255, 255, 255, 0.12);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .db-status .status-value {
            color: rgba(255, 255, 255, 0.3);
            font-weight: 600;
        }

        /* ─── REELS AREA ─── */
        .reels-area {
            position: relative;
            background:
                radial-gradient(ellipse at 50% 50%, #0f0c18, #050308);
            border-radius: var(--radius-lg);
            padding: 24px 16px;
            border: 1px solid rgba(212, 168, 71, 0.08);
            box-shadow:
                inset 0 8px 60px rgba(0, 0, 0, 0.95),
                inset 0 0 80px rgba(0, 0, 0, 0.6),
                0 4px 30px rgba(0, 0, 0, 0.5);
            margin-bottom: 24px;
            overflow: hidden;
        }
        .reels-area::before {
            content: '';
            position: absolute;
            inset: 0;
            background:
                radial-gradient(ellipse at 50% 50%, rgba(212, 168, 71, 0.02), transparent 70%);
            pointer-events: none;
            border-radius: inherit;
        }
        .reels-area::after {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: var(--radius-lg);
            padding: 1px;
            background: linear-gradient(180deg,
                    rgba(212, 168, 71, 0.10),
                    transparent 25%,
                    transparent 75%,
                    rgba(212, 168, 71, 0.05));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        /* ─── REEL GLASS OVERLAY ─── */
        .reels-area .glass-overlay {
            position: absolute;
            inset: 8px;
            border-radius: calc(var(--radius-lg) - 8px);
            background: linear-gradient(180deg,
                    rgba(255, 255, 255, 0.01) 0%,
                    transparent 20%,
                    transparent 80%,
                    rgba(255, 255, 255, 0.01) 100%);
            pointer-events: none;
            z-index: 1;
            border: 1px solid rgba(255, 255, 255, 0.02);
        }

        .reel-frame {
            display: flex;
            justify-content: center;
            gap: 16px;
            perspective: 1000px;
            position: relative;
            z-index: 1;
        }
        .reel {
            width: 124px;
            height: 222px;
            background:
                linear-gradient(180deg, #08050e, #0d0a16, #08050e);
            border-radius: var(--radius-md);
            border: 1px solid rgba(212, 168, 71, 0.06);
            box-shadow:
                inset 0 0 60px rgba(0, 0, 0, 0.95),
                inset 0 0 30px rgba(0, 0, 0, 0.8),
                0 4px 20px rgba(0, 0, 0, 0.6);
            overflow: hidden;
            position: relative;
            transition: border-color 0.5s, box-shadow 0.5s, transform 0.3s;
            transform: rotateY(0deg) scale(1);
            transform-style: preserve-3d;
        }
        .reel::before {
            content: '';
            position: absolute;
            inset: 3px;
            border-radius: calc(var(--radius-md) - 4px);
            border: 1px solid rgba(212, 168, 71, 0.03);
            pointer-events: none;
            z-index: 2;
        }
        .reel::after {
            content: '';
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 2;
            background:
                linear-gradient(to bottom,
                    rgba(0, 0, 0, 0.6) 0%,
                    transparent 12%,
                    transparent 88%,
                    rgba(0, 0, 0, 0.6) 100%);
            border-radius: var(--radius-md);
        }

        /* ─── REEL SHINE ─── */
        .reel .reel-shine {
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg,
                    rgba(255, 255, 255, 0.02) 0%,
                    transparent 40%,
                    transparent 60%,
                    rgba(255, 255, 255, 0.01) 100%);
            pointer-events: none;
            z-index: 3;
            border-radius: var(--radius-md);
        }

        .reel.winning {
            border-color: rgba(212, 168, 71, 0.5);
            box-shadow:
                inset 0 0 60px rgba(0, 0, 0, 0.95),
                0 0 40px rgba(212, 168, 71, 0.15),
                0 0 80px rgba(212, 168, 71, 0.05);
            animation: reelWinGlow 0.9s ease-in-out infinite alternate;
        }
        @keyframes reelWinGlow {
            0% {
                border-color: rgba(212, 168, 71, 0.25);
                box-shadow: inset 0 0 60px rgba(0, 0, 0, 0.95), 0 0 30px rgba(212, 168, 71, 0.06);
            }
            100% {
                border-color: rgba(212, 168, 71, 0.6);
                box-shadow: inset 0 0 60px rgba(0, 0, 0, 0.95), 0 0 60px rgba(212, 168, 71, 0.20), 0 0 120px rgba(212, 168, 71, 0.05);
            }
        }

        .reel-strip {
            display: flex;
            flex-direction: column;
            align-items: center;
            will-change: transform;
            transition: filter 0.15s;
            padding: 4px 0;
            position: relative;
            z-index: 1;
        }
        .reel-strip .symbol {
            width: 100%;
            height: 74px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
            flex-shrink: 0;
            user-select: none;
            position: relative;
            font-family: 'Segoe UI Emoji', 'Apple Color Emoji', sans-serif;
            transition: transform 0.2s;
            text-shadow: 0 0 30px rgba(255, 200, 100, 0.04);
        }
        .reel-strip .symbol::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 15%;
            right: 15%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(212, 168, 71, 0.04), transparent);
        }
        .reel-strip .symbol:last-child::after {
            display: none;
        }
        .reel-strip .symbol.bar-symbol {
            font-weight: 900;
            font-size: 34px;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: none;
            filter: drop-shadow(0 0 20px rgba(212, 168, 71, 0.12));
            letter-spacing: 4px;
        }

        .reel.spinning .reel-strip {
            filter: blur(1.5px);
        }
        .reel.spinning {
            border-color: rgba(212, 168, 71, 0.12);
        }

        .reel.winning .reel-strip .symbol {
            animation: symbolPulse 0.7s ease-in-out infinite alternate;
        }
        @keyframes symbolPulse {
            0% {
                transform: scale(1);
                text-shadow: 0 0 20px rgba(212, 168, 71, 0.05);
            }
            100% {
                transform: scale(1.12);
                text-shadow: 0 0 50px rgba(212, 168, 71, 0.4), 0 0 100px rgba(212, 168, 71, 0.10);
            }
        }

        /* ─── LED STRIP ─── */
        .led-strip {
            position: absolute;
            left: 16px;
            right: 16px;
            height: 3px;
            border-radius: 4px;
            opacity: 0.5;
            z-index: 3;
            overflow: hidden;
            pointer-events: none;
        }
        .led-strip::before {
            content: '';
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(90deg,
                    #ff1a1a 0px, #ff1a1a 6px,
                    #ff8800 6px, #ff8800 12px,
                    #ffdd00 12px, #ffdd00 18px,
                    #00cc44 18px, #00cc44 24px,
                    #0088ff 24px, #0088ff 30px,
                    #aa44ff 30px, #aa44ff 36px,
                    #ff1a1a 36px, #ff1a1a 42px);
            background-size: 42px 100%;
            animation: ledScroll 1.8s linear infinite;
        }
        .led-strip.top {
            top: 10px;
        }
        .led-strip.bottom {
            bottom: 10px;
        }
        @keyframes ledScroll {
            0% {
                transform: translateX(0);
            }
            100% {
                transform: translateX(-42px);
            }
        }
        .led-strip::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent, rgba(212, 168, 71, 0.12), transparent);
            filter: blur(4px);
            opacity: 0.5;
        }

        /* ─── CONTROLS ─── */
        .controls {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 16px;
            margin-bottom: 18px;
        }
        .bet-section {
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--bg-panel);
            padding: 4px 14px 4px 8px;
            border-radius: 60px;
            border: 1px solid var(--border-gold);
            backdrop-filter: blur(12px);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.02), var(--shadow-soft);
        }
        .bet-label {
            color: var(--text-muted);
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            padding: 0 6px 0 4px;
            font-family: var(--font-ui);
        }
        .bet-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            background: rgba(255, 255, 255, 0.03);
            color: var(--text-secondary);
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition-smooth);
            border: 1px solid rgba(255, 255, 255, 0.04);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-ui);
        }
        .bet-btn:hover {
            background: rgba(212, 168, 71, 0.08);
            border-color: rgba(212, 168, 71, 0.2);
            color: var(--gold);
            transform: scale(1.06);
        }
        .bet-btn:active {
            transform: scale(0.90);
        }
        .bet-display {
            color: var(--text-primary);
            font-size: 22px;
            font-weight: 800;
            min-width: 68px;
            text-align: center;
            font-variant-numeric: tabular-nums;
            background: rgba(0, 0, 0, 0.35);
            padding: 2px 12px;
            border-radius: var(--radius-sm);
            border: 1px solid rgba(255, 255, 255, 0.04);
            letter-spacing: 0.5px;
            font-family: var(--font-ui);
        }
        .max-btn {
            padding: 6px 18px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            background: rgba(255, 255, 255, 0.02);
            color: var(--text-secondary);
            font-weight: 700;
            font-size: 11px;
            cursor: pointer;
            transition: var(--transition-smooth);
            font-family: var(--font-ui);
            letter-spacing: 0.8px;
            text-transform: uppercase;
        }
        .max-btn:hover {
            background: rgba(212, 168, 71, 0.08);
            border-color: var(--gold);
            color: var(--gold);
            transform: scale(1.04);
        }
        .max-btn:active {
            transform: scale(0.94);
        }

        .spin-btn {
            padding: 14px 48px;
            border: none;
            border-radius: 60px;
            font-size: 24px;
            font-weight: 800;
            color: #fff;
            background: var(--ruby-gradient);
            cursor: pointer;
            transition: var(--transition-smooth);
            box-shadow:
                0 6px 30px rgba(192, 57, 43, 0.35),
                0 2px 10px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.10);
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 12px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            position: relative;
            overflow: hidden;
            font-family: var(--font-ui);
            text-transform: uppercase;
        }
        .spin-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg,
                    rgba(255, 255, 255, 0.12) 0%,
                    transparent 40%,
                    transparent 60%,
                    rgba(255, 255, 255, 0.04) 100%);
            pointer-events: none;
            border-radius: inherit;
        }
        .spin-btn:hover:not(:disabled) {
            transform: translateY(-3px) scale(1.02);
            box-shadow:
                0 10px 50px rgba(192, 57, 43, 0.5),
                0 4px 20px rgba(0, 0, 0, 0.4),
                var(--ruby-glow);
        }
        .spin-btn:active:not(:disabled) {
            transform: scale(0.95);
            box-shadow: 0 4px 20px rgba(192, 57, 43, 0.3);
        }
        .spin-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
            box-shadow: 0 4px 16px rgba(192, 57, 43, 0.05);
        }
        .spin-btn .spin-icon {
            font-size: 30px;
            line-height: 1;
        }
        .spin-btn:not(:disabled)::after {
            content: '';
            position: absolute;
            inset: -3px;
            border-radius: 64px;
            background: linear-gradient(135deg,
                    var(--gold),
                    transparent 35%,
                    transparent 65%,
                    var(--gold));
            z-index: -1;
            opacity: 0;
            transition: var(--transition-smooth);
            padding: 2px;
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
        }
        .spin-btn:not(:disabled):hover::after {
            opacity: 0.5;
        }

        /* ─── MESSAGE AREA ─── */
        .message-area {
            text-align: center;
            min-height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 14px;
        }
        .message {
            font-size: 20px;
            font-weight: 700;
            padding: 4px 30px;
            border-radius: 60px;
            background: var(--bg-panel);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: var(--transition-smooth);
            font-family: var(--font-ui);
            letter-spacing: 0.3px;
            min-height: 46px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.02);
        }
        .message.win {
            color: var(--gold-light);
            border-color: rgba(212, 168, 71, 0.2);
            background: rgba(212, 168, 71, 0.06);
            text-shadow: 0 0 40px rgba(212, 168, 71, 0.08);
            animation: msgWin 0.5s var(--transition-bounce);
        }
        .message.lose {
            color: #ff6a6a;
            border-color: rgba(255, 80, 80, 0.12);
            background: rgba(255, 80, 80, 0.04);
        }
        .message.info {
            color: #8ab8ff;
            border-color: rgba(138, 184, 255, 0.06);
            background: rgba(138, 184, 255, 0.02);
        }
        .message.jackpot {
            color: #ffd700;
            border-color: rgba(255, 215, 0, 0.25);
            background: rgba(255, 215, 0, 0.06);
            text-shadow: 0 0 60px rgba(255, 215, 0, 0.15);
            animation: msgJackpot 0.6s var(--transition-bounce);
        }
        @keyframes msgWin {
            0% {
                transform: scale(0.8) rotate(-2deg);
                opacity: 0;
            }
            100% {
                transform: scale(1) rotate(0deg);
                opacity: 1;
            }
        }
        @keyframes msgJackpot {
            0% {
                transform: scale(0.5) rotate(-5deg);
                opacity: 0;
            }
            50% {
                transform: scale(1.15) rotate(2deg);
            }
            100% {
                transform: scale(1) rotate(0deg);
                opacity: 1;
            }
        }

        /* ─── BOTTOM PANEL ─── */
        .bottom-panel {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            margin-top: 4px;
        }
        .history-box {
            flex: 2;
            min-width: 180px;
            background: var(--bg-panel);
            border-radius: var(--radius-md);
            padding: 12px 18px 10px;
            border: 1px solid rgba(255, 255, 255, 0.03);
            max-height: 136px;
            overflow-y: auto;
            backdrop-filter: blur(8px);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.02);
        }
        .history-box::-webkit-scrollbar {
            width: 3px;
        }
        .history-box::-webkit-scrollbar-track {
            background: transparent;
        }
        .history-box::-webkit-scrollbar-thumb {
            background: rgba(212, 168, 71, 0.15);
            border-radius: 10px;
        }
        .history-box::-webkit-scrollbar-thumb:hover {
            background: rgba(212, 168, 71, 0.25);
        }
        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--text-muted);
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.8px;
            margin-bottom: 6px;
            font-family: var(--font-ui);
        }
        .history-header span {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .clear-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 14px;
            padding: 2px 6px;
            transition: var(--transition-smooth);
            border-radius: 6px;
            line-height: 1;
        }
        .clear-btn:hover {
            color: #ff6a6a;
            background: rgba(255, 80, 80, 0.06);
        }
        .history-list {
            list-style: none;
            font-size: 13px;
            color: var(--text-secondary);
            font-family: var(--font-ui);
        }
        .history-list li {
            padding: 4px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.02);
            display: flex;
            justify-content: space-between;
            gap: 12px;
            align-items: center;
            animation: historyFade 0.3s ease;
        }
        .history-list li:last-child {
            border-bottom: none;
        }
        @keyframes historyFade {
            0% {
                opacity: 0;
                transform: translateY(-6px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .history-list li .h-symbols {
            color: var(--text-primary);
            letter-spacing: 2px;
            font-weight: 500;
            font-size: 14px;
        }
        .history-list li .h-result {
            font-weight: 700;
            font-size: 12px;
            padding: 1px 12px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.02);
        }
        .history-list li .h-result.win {
            color: #7dffb3;
            background: rgba(125, 255, 179, 0.06);
        }
        .history-list li .h-result.lose {
            color: #ff6a6a;
            background: rgba(255, 80, 80, 0.04);
        }
        .history-list li .h-result.jackpot {
            color: #ffd700;
            background: rgba(255, 215, 0, 0.08);
            animation: jackpotPulse 1s ease-in-out infinite;
        }
        @keyframes jackpotPulse {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }
        .history-list li.empty {
            color: var(--text-muted);
            font-style: italic;
            justify-content: center;
            padding: 10px 0;
            font-size: 12px;
            border-bottom: none;
            animation: none;
        }

        .db-buttons {
            flex: 1;
            min-width: 120px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            justify-content: flex-end;
        }

        /* ─── TOP-UP BUTTON – hidden by default ─── */
        .topup-btn {
            display: none;
            background: none;
            border: none;
            color: #7dffb3;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition-smooth);
            padding: 4px 8px;
            border-radius: var(--radius-sm);
            font-family: var(--font-ui);
            align-items: center;
            justify-content: center;
            gap: 4px;
            width: 100%;
        }
        .topup-btn.show {
            display: inline-flex;
        }
        .topup-btn:hover {
            background: rgba(125, 255, 179, 0.04);
            transform: scale(1.02);
            color: #b3ffd9;
        }
        .topup-btn:active {
            transform: scale(0.94);
        }

        /* ─── AUTH OVERLAY ─── */
        .auth-overlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: rgba(11, 7, 25, 0.94);
            backdrop-filter: blur(20px);
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 24px;
        }
        .auth-overlay.show {
            display: flex;
        }
        .auth-overlay .lock-icon {
            font-size: 4.5rem;
            color: rgba(251, 191, 36, 0.15);
            margin-bottom: 20px;
            animation: lockPulse 3s ease-in-out infinite;
        }
        @keyframes lockPulse {
            0%,
            100% {
                transform: scale(1);
                opacity: 0.8;
            }
            50% {
                transform: scale(1.08);
                opacity: 1;
            }
        }
        .auth-overlay h2 {
            font-family: var(--font-orbitron);
            font-weight: 700;
            font-size: 1.8rem;
            color: #fff;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }
        .auth-overlay h2 span {
            color: var(--gold-light);
        }
        .auth-overlay p {
            color: rgba(255, 255, 255, 0.25);
            font-size: 0.95rem;
            max-width: 420px;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .auth-overlay .btn-login-now {
            padding: 14px 48px;
            border-radius: 16px;
            background: linear-gradient(135deg, #fbbf24, #b8860b);
            border: none;
            color: #0b0719;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
            font-family: var(--font-ui);
            display: inline-flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 8px 30px rgba(251, 191, 36, 0.15);
        }
        .auth-overlay .btn-login-now:hover {
            transform: scale(1.04);
            box-shadow: 0 8px 50px rgba(251, 191, 36, 0.25);
        }

        /* ─── STATUS CARD ─── */
        #statusCard {
            display: none;
            text-align: center;
            padding: 40px 20px;
            border-radius: 28px;
            border: 1px solid rgba(255, 215, 0, 0.05);
            background: rgba(255, 255, 255, 0.02);
            margin: 10px 0 16px;
            transition: 0.3s;
            min-height: 260px;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        #statusCard .status-icon {
            font-size: 3.2rem;
            display: block;
            margin-bottom: 14px;
        }
        #statusCard .status-icon.spinning {
            animation: spin 1.2s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        #statusCard .status-title {
            color: #fff;
            font-size: 1.2rem;
            font-weight: 600;
            font-family: var(--font-orbitron);
        }
        #statusCard .status-desc {
            color: rgba(255, 255, 255, 0.35);
            font-size: 0.9rem;
            margin-top: 6px;
        }
        #statusCard .status-detail {
            color: rgba(255, 255, 255, 0.15);
            font-size: 0.75rem;
            margin-top: 10px;
            font-family: monospace;
            word-break: break-all;
        }
        #statusCard .progress-bar {
            width: 100%;
            max-width: 400px;
            height: 3px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            margin-top: 20px;
            overflow: hidden;
        }
        #statusCard .progress-bar .fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #7c3aed, #a78bfa, var(--gold));
            border-radius: 10px;
            transition: width 0.4s ease;
        }
        #statusCard .retry-area {
            margin-top: 24px;
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }
        #statusCard .retry-area .btn-sm {
            padding: 10px 28px;
            border-radius: 100px;
            border: none;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: 0.3s;
            font-family: var(--font-ui);
        }
        #statusCard .retry-area .btn-sm-primary {
            background: linear-gradient(135deg, #fbbf24, #b8860b);
            color: #0b0719;
        }
        #statusCard .retry-area .btn-sm-primary:hover {
            transform: scale(1.04);
            box-shadow: 0 8px 30px rgba(251, 191, 36, 0.25);
        }
        #statusCard .retry-area .btn-sm-outline {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.10);
            color: rgba(255, 255, 255, 0.5);
        }
        #statusCard .retry-area .btn-sm-outline:hover {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(167, 139, 250, 0.3);
            color: #fff;
        }

        /* ─── TOP-UP MODAL ─── */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(12px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal {
            background: rgba(20, 16, 45, 0.97);
            border: 1px solid rgba(255, 215, 0, 0.06);
            border-radius: 28px;
            padding: 34px 38px;
            max-width: 420px;
            width: 90%;
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(20px);
        }
        .modal h2 {
            font-family: var(--font-orbitron);
            font-weight: 700;
            font-size: 1.2rem;
            color: #fff;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .modal h2 i {
            color: #fbbf24;
        }
        .modal .form-group {
            margin-bottom: 16px;
        }
        .modal .form-group label {
            display: block;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: rgba(255, 255, 255, 0.15);
            margin-bottom: 4px;
            font-weight: 600;
        }
        .modal .form-group input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            transition: 0.3s;
            font-family: var(--font-ui);
        }
        .modal .form-group input:focus {
            border-color: rgba(251, 191, 36, 0.2);
            background: rgba(255, 255, 255, 0.05);
        }
        .modal .form-group .input-hint {
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.08);
            margin-top: 4px;
        }
        .modal .form-actions {
            display: flex;
            gap: 12px;
            margin-top: 24px;
            justify-content: flex-end;
        }
        .modal .form-actions button {
            padding: 10px 24px;
            border-radius: 100px;
            border: none;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: 0.3s;
            font-family: var(--font-ui);
        }
        .modal .form-actions .btn-cancel {
            background: rgba(255, 255, 255, 0.04);
            color: rgba(255, 255, 255, 0.3);
        }
        .modal .form-actions .btn-cancel:hover {
            background: rgba(255, 255, 255, 0.08);
        }
        .modal .form-actions .btn-save {
            background: linear-gradient(135deg, #34d399, #059669);
            color: #0b0719;
        }
        .modal .form-actions .btn-save:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 30px rgba(52, 211, 153, 0.2);
        }

        /* ─── TOAST ─── */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            padding: 14px 24px;
            border-radius: 16px;
            background: rgba(15, 12, 35, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.85rem;
            color: #fff;
            transform: translateY(80px);
            opacity: 0;

            // ─── CRYPTO HELPERS ──────────────────────────────
            async function deriveKey(password, salt) {
                const enc = new TextEncoder();
                const keyMaterial = await crypto.subtle.importKey(
                    'raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']
                );
                return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: salt, iterations: 100000, hash: 'SHA-256' },
                    keyMaterial, { name: 'AES-GCM', length: 256 },
                    false,
                    ['encrypt', 'decrypt']
                );
            }

            async function encryptData(plaintext) {
                const enc = new TextEncoder();
                const salt = crypto.getRandomValues(new Uint8Array(16));
                const iv = crypto.getRandomValues(new Uint8Array(12));
                const key = await deriveKey(ENCRYPTION_KEY_HASH, salt);
                const encrypted = await crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv },
                    key,
                    enc.encode(plaintext)
                );
                const parts = [
                    btoa(String.fromCharCode(...salt)),
                    btoa(String.fromCharCode(...iv)),
                    btoa(String.fromCharCode(...new Uint8Array(encrypted)))
                ];
                return parts.join(':');
            }

            async function decryptData(encryptedString) {
                const parts = encryptedString.split(':');
                if (parts.length !== 3) throw new Error('Invalid encrypted format');
                const salt = Uint8Array.from(atob(parts[0]), c => c.charCodeAt(0));
                const iv = Uint8Array.from(atob(parts[1]), c => c.charCodeAt(0));
                const ciphertext = Uint8Array.from(atob(parts[2]), c => c.charCodeAt(0));
                const key = await deriveKey(ENCRYPTION_KEY_HASH, salt);
                const decrypted = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv },
                    key,
                    ciphertext
                );
                return new TextDecoder().decode(decrypted);
            }

            // ─── REEL HELPERS ──────────────────────────────────
            function pickSymbol() {
                const total = SYMBOL_WEIGHTS.reduce((a, b) => a + b, 0);
                let r = Math.random() * total;
                for (let i = 0; i < SYMBOL_WEIGHTS.length; i++) {
                    r -= SYMBOL_WEIGHTS[i];
                    if (r <= 0) return SYMBOLS[i];
                }
                return SYMBOLS[0];
            }

            function buildStrip(targetSymbol) {
                const strip = [];
                for (let i = 0; i < reelStripLength; i++) {
                    strip.push(pickSymbol());
                }
                strip[10] = targetSymbol;
                return strip;
            }

            function renderStrip(stripEl, symbols) {
                stripEl.innerHTML = symbols.map(s => {
                    if (s === 'BAR') {
                        return `<div class="symbol bar-symbol">${s}</div>`;
                    }
                    return `<div class="symbol">${s}</div>`;
                }).join('');
            }

            function getTargetOffset(targetIndex, symbolHeight = 68) {
                return -(targetIndex - 1) * symbolHeight;
            }

            function resetReelsToDefault() {
                const defaultSymbols = ['🍒', '🍋', '🍊'];
                reelStrips.forEach((strip, i) => {
                    const sym = defaultSymbols[i % defaultSymbols.length];
                    const symbols = buildStrip(sym);
                    renderStrip(strip, symbols);
                    const targetIndex = 10;
                    const offset = getTargetOffset(targetIndex, 68);
                    strip.style.transition = 'none';
                    strip.style.transform = `translateY(${offset}px)`;
                    strip.style.filter = 'blur(0px)';
                    reelContainers[i].classList.remove('winning', 'spinning');
                });
            }

            // ─── SPIN ANIMATION ────────────────────────────────
            // Uses a custom cubic-bezier with very strong deceleration:
            // (0.05, 0.85, 0.01, 1) creates a fast start and a dramatic slow-down at the end.
            // The near-zero x2 (0.01) ensures the reel crawls to a stop.
            function spinReel(reelIndex, targetSymbol, delay, duration) {
                return new Promise((resolve) => {
                    const stripEl = reelStrips[reelIndex];
                    const reelEl = reelContainers[reelIndex];

                    const symbols = buildStrip(targetSymbol);
                    renderStrip(stripEl, symbols);

                    const targetIndex = 10;
                    const symbolHeight = 68;
                    const targetOffset = getTargetOffset(targetIndex, symbolHeight);

                    let startIndex = Math.floor(Math.random() * (reelStripLength - 3));
                    while (Math.abs(startIndex - targetIndex) < 3) {
                        startIndex = Math.floor(Math.random() * (reelStripLength - 3));
                    }
                    const startOffset = getTargetOffset(startIndex, symbolHeight);

                    // Reset transition for instant jump to start
                    stripEl.style.transition = 'none';
                    stripEl.style.transform = `translateY(${startOffset}px)`;
                    stripEl.style.filter = 'blur(2px)';
                    stripEl.offsetHeight; // force reflow

                    reelEl.classList.add('spinning');

                    // After the delay, animate to target with strong deceleration
                    setTimeout(() => {
                        // Strong ease-out: fast start, very slow finish
                        // x1=0.05 (fast start), y1=0.85, x2=0.01 (extremely slow at end), y2=1
                        stripEl.style.transition =
                            `transform ${duration}ms cubic-bezier(0.05, 0.85, 0.01, 1)`;
                        stripEl.style.transform = `translateY(${targetOffset}px)`;
                        stripEl.style.filter = 'blur(0px)';

                        const onFinish = () => {
                            stripEl.removeEventListener('transitionend', onFinish);
                            reelEl.classList.remove('spinning');
                            resolve();
                        };
                        stripEl.addEventListener('transitionend', onFinish);
                    }, delay);
                });
            }

            async function evaluateSpin(resultSymbols) {
                const allSame = resultSymbols.every(s => s === resultSymbols[0]);
                let winAmount = 0;
                let winType = 'lose';

                if (allSame) {
                    const multiplier = PAYOUTS[resultSymbols[0]] || 0;
                    winAmount = currentBet * multiplier;
                    winType = 'win';
                    reelContainers.forEach(el => el.classList.add('winning'));
                    if (resultSymbols[0] === '7️⃣') {

                        setMessage(`🎰 JACKPOT! PHP${winAmount}! (${resultSymbols.join(' ')})`, 'jackpot');
                    } else {
                        setMessage(`🎉 WIN PHP${winAmount}! (${resultSymbols.join(' ')})`, 'win');
                    }
                } else {
                    const counts = {};
                    for (const s of resultSymbols) {
                        counts[s] = (counts[s] || 0) + 1;
                    }
                    let hasPair = false;
                    let pairSymbol = null;
                    for (const [sym, count] of Object.entries(counts)) {
                        if (count >= 2) {
                            hasPair = true;
                            pairSymbol = sym;
                            break;
                        }
                    }
                    if (hasPair) {
                        winAmount = currentBet * 2;
                        winType = 'win';
                        reelContainers.forEach((el, i) => {
                            if (resultSymbols[i] === pairSymbol) {
                                el.classList.add('winning');
                            }
                        });
                        setMessage(`🎉 WIN PHP${winAmount}! (${resultSymbols.join(' ')})`, 'win');
                    } else {
                        setMessage(`😞 No luck… (${resultSymbols.join(' ')})`, 'lose');
                    }
                }

                spinAudio.pause();
                spinAudio.currentTime = 0;

                if (winType === 'win') {
                    currentUser.balance += winAmount;
                    currentWinAmount = winAmount;
                    slotTotalWins += winAmount;
                } else {
                    currentWinAmount = 0;
                    slotTotalLosses += currentBet;
                }

                slotHistory.push({
                    bet: currentBet,
                    result: winType,
                    amount: winAmount,
                    symbols: resultSymbols,
                    timestamp: new Date().toISOString()
                });
                if (slotHistory.length > 100) slotHistory = slotHistory.slice(-100);

                isSpinning = false;
                updateAllUI();
                await saveSlotDataToDB();
                setTimeout(() => clearWinHighlights(), 4000);

            // ─── BET CONTROLS ──────────────────────────────────
            function adjustBet(direction) {
                if (isSpinning) return;
                const minBet = slotSettings.minBet || 10;

                let idx = betIndex;
                if (isCustomBet) {
                    if (direction === 1) {
                        idx = BET_OPTIONS.findIndex(b => b > currentBet);
                        if (idx === -1) idx = BET_OPTIONS.length - 1;
                    } else {
                        let found = -1;
                        for (let i = 0; i < BET_OPTIONS.length; i++) {
                            if (BET_OPTIONS[i] < currentBet) found = i;
                        }
                        idx = found;
                        if (idx === -1) idx = 0;
                    }
                    isCustomBet = false;
                } else {
                    idx = betIndex + direction;
                    if (idx < 0) idx = 0;
                    if (idx >= BET_OPTIONS.length) idx = BET_OPTIONS.length - 1;
                }

                let newBet = BET_OPTIONS[idx];
                if (newBet < minBet) newBet = minBet;
                let actualIdx = BET_OPTIONS.indexOf(newBet);
                if (actualIdx === -1) {
                    let best = 0;
                    for (let i = 0; i < BET_OPTIONS.length; i++) {
                        if (BET_OPTIONS[i] <= newBet) best = i;
                    }
                    actualIdx = best;
                    newBet = BET_OPTIONS[actualIdx];
                }
                betIndex = actualIdx;
                isCustomBet = false;
                currentBet = newBet;
                updateAllUI();
            }

            function setMaxBet() {
                if (isSpinning) return;
                if (!currentUser) return;
                const maxPossible = Math.floor(currentUser.balance);
                const minBet = slotSettings.minBet || 10;
                if (maxPossible < minBet) {
                    setMessage('❌ Balance too low for minimum bet.', 'lose');
                    return;
                }
                currentBet = maxPossible;
                isCustomBet = true;
                betIndex = -1;
                updateAllUI();
                setMessage(`💰 Bet set to MAX: PHP${formatCurrency(currentBet)}`, 'info');
            }

            // ─── TOP UP – guarded for admin only ──────────────
            function openTopupModal() {
                if (!currentUser) {
                    showToast('Please log in first.', 'error');
                    return;
                }
                if (!isAdminUser(currentUser)) {
                    showToast('⛔ Only the admin can perform top-ups.', 'error');
                    return;
                }
                topupUserId.value = currentUser.id;
                topupAmount.value = '';
                topupAmount.focus();
                document.querySelector('#topupModal .modal h2').innerHTML =
                    `<i class="fas fa-coins"></i> Top Up – ${currentUser.name || 'User'}`;
                topupModal.classList.add('active');
            }

            topupCancel.addEventListener('click', () => topupModal.classList.remove('active'));
            topupModal.addEventListener('click', (e) => {
                if (e.target === topupModal) topupModal.classList.remove('active');
            });

            topupForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                if (!currentUser || !isAdminUser(currentUser)) {
                    showToast('⛔ Only the admin can perform top-ups.', 'error');
                    topupModal.classList.remove('active');
                    return;
                }

                const amount = parseFloat(topupAmount.value);
                if (!amount || amount <= 0) {
                    showToast('Please enter a valid amount.', 'error');
                    return;
                }
                const userId = topupUserId.value;
                if (!userId) {
                    showToast('User ID missing.', 'error');
                    return;
                }

                const user = dbData.users.find(u => u.id === userId);
                if (!user) {
                    showToast('User not found.', 'error');
                    return;
                }

                user.balance = (user.balance || 0) + amount;
                if (currentUser && currentUser.id === userId) {
                    currentUser.balance = user.balance;
                }

                try {
                    await saveDatabase(dbData);
                    topupModal.classList.remove('active');
                    showToast(`PHP${amount.toFixed(2)} added to ${user.name}'s balance!`, 'success');
                    updateAllUI();
                    const refreshed = dbData.users.find(u => u.id === userId);
                    if (refreshed) {
                        currentUser = refreshed;
                        loadSlotDataFromUser(currentUser);
                    }
                } catch (err) {
                    showToast('Top-up failed: ' + err.message, 'error');
                }
            });

            // ─── CLEAR HISTORY ─────────────────────────────────
            clearHistoryBtn.addEventListener('click', () => {
                if (!slotHistory || slotHistory.length === 0) return;
                if (!confirm('Clear history?')) return;
                slotHistory = [];
                updateAllUI();
                saveSlotDataToDB();
                setMessage('🗑️ History cleared', 'info');
            });

            // ─── BACK BUTTON ──────────────────────────────────
            backBtn.addEventListener('click', () => {
                window.location.href = 'dashboard.html';
            });

            // ─── AUDIO ──────────────────────────────────────────
            function enableAudio() {
                if (bgAudio.paused) {
                    bgAudio.play().catch(() => {});
                }
                document.removeEventListener('click', enableAudio);
                document.removeEventListener('keydown', enableAudio);
            }
            document.addEventListener('click', enableAudio);
            document.addEventListener('keydown', enableAudio);

            muteBtn.addEventListener('click', () => {
                isMuted = !isMuted;
                bgAudio.muted = isMuted;
                spinAudio.muted = isMuted;
                jackpotAudio.muted = isMuted;
                muteBtn.textContent = isMuted ? '🔇' : '🔊';
            });

            // ─── SESSION CHECK ─────────────────────────────────
            function checkSession() {
                const saved = sessionStorage.getItem('auth_user');
                if (!saved) {
                    showAuthOverlay(true);
                    showUI(false);
                    return false;
                }
                try {
                    const user = JSON.parse(saved);
                    const exists = dbData.users.find(u => u.id === user.id);
                    if (exists) {
                        if (exists.balance === undefined) exists.balance = 0;
                        currentUser = exists;
                        loadSlotDataFromUser(exists);
                        showAuthOverlay(false);
                        showUI(true);
                        return true;
                    } else {
                        sessionStorage.removeItem('auth_user');
                        showAuthOverlay(true);
                        showUI(false);
                        showToast('Your session is no longer valid. Please log in again.', 'error');
                        return false;
                    }
                } catch (e) {
                    sessionStorage.removeItem('auth_user');
                    showAuthOverlay(true);
                    showUI(false);
                    console.warn('Session check error:', e);
                    return false;
                }
            }

            // ─── TOAST ──────────────────────────────────────────
            function showToast(msg, type = 'success') {
                toast.className = 'toast ' + type;
                const icons = {
                    success: 'fas fa-check-circle',
                    error: 'fas fa-exclamation-circle',
                    warning: 'fas fa-exclamation-triangle',
                    info: 'fas fa-info-circle'
                };
                toast.querySelector('i').className = icons[type] || icons.info;
                toastMessage.textContent = msg;
                toast.classList.add('show');
                clearTimeout(toast._timer);
                toast._timer = setTimeout(() => toast.classList.remove('show'), 3200);
            }

            // ─── INIT ──────────────────────────────────────────
            async function init() {
                if (initDone) return;
                initDone = true;

                showUI(false);
                updateStatus('spinning', '📡', 'Connecting to GitHub…', 'Loading database from repository…');
                setProgress(10);

                const token = localStorage.getItem(GITHUB_TOKEN_KEY);
                if (!token) {
                    updateStatus('🔑', '🔑', 'GitHub Token Required', 'Please enter your GitHub Personal Access Token.',
                        'Click "Retry" to enter your token.');
                    showRetryButtons(true);
                    showToast('GitHub token required to access database.', 'info');
                    setDbStatus('offline', 'no token');
                } else {
                    const loaded = await loadDatabase(true);
                    if (loaded) {
                        const authed = checkSession();
                        if (!authed) {
                            showAuthOverlay(true);
                            showUI(false);
                        } else {
                            showAuthOverlay(false);
                            showUI(true);
                        }
                    } else {
                        showRetryButtons(true);
                        const saved = sessionStorage.getItem('auth_user');
                        if (saved) {
                            showAuthOverlay(true);
                            showUI(false);
                        } else {
                            showAuthOverlay(true);
                            showUI(false);
                        }
                    }
                }

                // ─── EVENT LISTENERS ──────────────────────────
                spinBtn.addEventListener('click', spin);
                betUp.addEventListener('click', () => adjustBet(1));
                betDown.addEventListener('click', () => adjustBet(-1));
                maxBetBtn.addEventListener('click', setMaxBet);
                topUpBtn.addEventListener('click', openTopupModal);

                document.addEventListener('keydown', (e) => {
                    if (e.key === ' ' && !e.repeat) {
                        e.preventDefault();
                        if (!isSpinning && currentUser && currentUser.balance >= currentBet) spin();
                    }
                });

                // ─── PERIODIC SAVE ────────────────────────────
                setInterval(() => {
                    if (currentUser) {
                        saveSlotDataToDB().catch(() => {});
                    }
                }, 30000);

                console.log('🎰 Slot machine initialized (GitHub database). Top-up is admin-only.');
            }

            // ─── START ─────────────────────────────────────────
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

            window.__slot = {
                db: () => dbData,
                user: () => currentUser,
                refresh: async () => {
                    const ok = await loadDatabase(true);
                    if (ok) checkSession();
                },
                save: saveSlotDataToDB
            };

        })();
    </script>

</body>
</html>
