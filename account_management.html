<body>

    <div class="orb orb--1"></div>
    <div class="orb orb--2"></div>

    <div class="wrapper">

        <!-- ========== NAVBAR ========== -->

                        <h4 id="dashName">Arvin</h4>
                        <span><i class="fas fa-id-badge"></i> <span id="dashEmail">itarvincyberdevstack@gmail.com</span></span>
                    </div>
                </div>

            </div>
        </div>

        <!-- ========== MANAGEMENT CONTENT ========== -->

                                <th>User</th>
                                <th>Username</th>

    <script>

        // ============================================================
        //  CONSTANTS – GitHub (same as login/register)
        // ============================================================
        const ENCRYPTION_KEY_HASH = '$2a$12$tLvlRpTmRlBdGSUBZ8.phe4dOfl09CcFEp2cjG.U8lpPKvtwku5N6';
        const GITHUB_OWNER = 'tcute6851';
        const GITHUB_REPO = 'Arvroyal-Casino-Games';
        const GITHUB_PATH = 'CasinoDB.json';
        const GITHUB_TOKEN_KEY = 'github_pat';

        let dbData = { users: [] };
        let _githubSha = null;
        let _defaultBranch = 'main';
        let isRetrying = false;

        // ─── DOM REFS ──────────────────────────────────────────
        const statusCard = document.getElementById('statusCard');
        const statusIcon = document.getElementById('statusIcon');

        // ============================================================
        //  CRYPTO HELPERS (identical)
        // ============================================================
        async function deriveKey(password, salt) {
            const enc = new TextEncoder();
            const keyMaterial = await crypto.subtle.importKey(
                'raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']
            );
            return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: salt, iterations: 100000, hash: 'SHA-256' },
                keyMaterial, { name: 'AES-GCM', length: 256 },
                false,
                ['encrypt', 'decrypt']
            );
        }

        async function encryptData(plaintext) {
            const enc = new TextEncoder();
            const salt = crypto.getRandomValues(new Uint8Array(16));
            const iv = crypto.getRandomValues(new Uint8Array(12));
            const key = await deriveKey(ENCRYPTION_KEY_HASH, salt);
            const encrypted = await crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv },
                key,
                enc.encode(plaintext)
            );
            const parts = [
                btoa(String.fromCharCode(...salt)),
                btoa(String.fromCharCode(...iv)),
                btoa(String.fromCharCode(...new Uint8Array(encrypted)))
            ];
            return parts.join(':');
        }

        async function decryptData(encryptedString) {
            const parts = encryptedString.split(':');
            if (parts.length !== 3) throw new Error('Invalid encrypted format');
            const salt = Uint8Array.from(atob(parts[0]), c => c.charCodeAt(0));
            const iv = Uint8Array.from(atob(parts[1]), c => c.charCodeAt(0));
            const ciphertext = Uint8Array.from(atob(parts[2]), c => c.charCodeAt(0));
            const key = await deriveKey(ENCRYPTION_KEY_HASH, salt);
            const decrypted = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv },
                key,
                ciphertext
            );
            return new TextDecoder().decode(decrypted);
        }

        // ============================================================
        //  GITHUB HELPERS (same as login/register)
        // ============================================================
        function getGitHubToken() {
            let token = localStorage.getItem(GITHUB_TOKEN_KEY);
            if (!token) {
                token = prompt('🔑 Enter your GitHub Personal Access Token (with repo scope):');
                if (token) {
                    localStorage.setItem(GITHUB_TOKEN_KEY, token);
                }
            }
            return token;
        }

        function clearToken() {
            localStorage.removeItem(GITHUB_TOKEN_KEY);
        }

        async function detectDefaultBranch(token) {
            try {
                const url = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}`;
                const resp = await fetch(url, {
                    headers: {
                        'Authorization': `token ${token}`,
                        'Accept': 'application/vnd.github.v3+json'
                    }
                });
                if (resp.ok) {
                    const data = await resp.json();
                    return data.default_branch || 'main';
                }
            } catch {}
            return 'main';
        }

        async function createEmptyDatabase(token, branch) {
            const emptyData = { users: [] };
            const json = JSON.stringify(emptyData, null, 2);
            const encrypted = await encryptData(json);
            const content = btoa(encrypted);
            const url = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${GITHUB_PATH}`;
            const response = await fetch(url, {
                method: 'PUT',
                headers: {
                    'Authorization': `token ${token}`,
                    'Content-Type': 'application/json',
                    'Accept': 'application/vnd.github.v3+json'
                },
                body: JSON.stringify({
                    message: 'Initialize CasinoDB.json',
                    content: content,
                    branch: branch
                })
            });
            if (!response.ok) {
                const errorData = await response.json().catch(() => ({}));
                const msg = errorData.message || response.statusText;
                throw new Error(`GitHub API error (${response.status}): ${msg}`);
            }
            const result = await response.json();
            _githubSha = result.content.sha;
        }

        async function loadDatabase(showToastMsg = true) {
            let token = getGitHubToken();
            if (!token) {
                updateStatus('❌', '❌', 'Token Required', 'Please enter your GitHub token to continue.', 'Click "Retry" to try again.');
                showRetryButtons(true);
                if (showToastMsg) showToast('GitHub token required.', 'error');
                showUI(false);
                setDbStatus('offline', 'no token');
                return false;
            }

            try {
                updateStatus('spinning', '📡', 'Connecting to GitHub…', 'Fetching database from repository…');
                setProgress(20);

                const branch = await detectDefaultBranch(token);
                _defaultBranch = branch;

                setProgress(40);

                const url = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${GITHUB_PATH}`;
                const response = await fetch(url, {
                    headers: {
                        'Authorization': `token ${token}`,
                        'Accept': 'application/vnd.github.v3+json'
                    }
                });

                if (response.status === 404) {
                    updateStatus('spinning', '📝', 'Creating database…', 'No database found. Creating new one…');
                    setProgress(60);
                    await createEmptyDatabase(token, branch);
                    dbData = { users: [] };
                    setProgress(100);
                    if (showToastMsg) showToast('✅ New database created on GitHub!', 'success');
                    showUI(true);
                    await checkSessionAndAccess();
                    setDbStatus('online', 'github');
                    return true;
                }

                if (response.status === 401) {
                    clearToken();
                    updateStatus('❌', '❌', 'Invalid Token', 'Your GitHub token is invalid or expired.', 'Click "Retry" to enter a new token.');
                    showRetryButtons(true);
                    if (showToastMsg) showToast('Invalid GitHub token. Please try again.', 'error');
                    showUI(false);
                    setDbStatus('offline', 'invalid token');
                    return false;
                }

                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({}));
                    const msg = errorData.message || response.statusText;
                    throw new Error(`GitHub API error (${response.status}): ${msg}`);
                }

                const data = await response.json();
                const content = atob(data.content);
                _githubSha = data.sha;

                let json;
                try {
                    const decrypted = await decryptData(content);
                    json = JSON.parse(decrypted);
                } catch {
                    json = JSON.parse(content);
                }
                dbData = json;
                setProgress(100);
                if (showToastMsg) showToast('✅ Your access granted is successful!!', 'success');
                showUI(true);
                await checkSessionAndAccess();
                setDbStatus('online', 'github');
                return true;
            } catch (error) {
                console.error('loadDatabase error:', error);
                const errorMsg = error.message || 'Could not connect to GitHub.';
                updateStatus('❌', '❌', 'Loading Failed', errorMsg, 'Check your internet connection and token.');
                showRetryButtons(true);
                if (showToastMsg) showToast('Failed to load database: ' + errorMsg, 'error');
                showUI(false);
                setDbStatus('offline', 'error');
                return false;
            }
        }

        async function saveDatabase(data) {
            const token = localStorage.getItem(GITHUB_TOKEN_KEY);
            if (!token) {
                showToast('No GitHub token found.', 'error');
                return;
            }

            const json = JSON.stringify(data, null, 2);
            const encrypted = await encryptData(json);
            const content = btoa(encrypted);

            const url = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${GITHUB_PATH}`;
            const response = await fetch(url, {
                method: 'PUT',
                headers: {
                    'Authorization': `token ${token}`,
                    'Content-Type': 'application/json',
                    'Accept': 'application/vnd.github.v3+json'
                },
                body: JSON.stringify({
                    message: 'Update CasinoDB.json',
                    content: content,
                    sha: _githubSha,
                    branch: _defaultBranch
                })
            });

            if (response.status === 401) {
                clearToken();
                showToast('GitHub token expired. Please refresh and enter a new token.', 'error');
                return;
            }

            if (!response.ok) {
                const errorData = await response.json().catch(() => ({}));
                const msg = errorData.message || response.statusText;
                throw new Error(`Failed to save: ${msg}`);
            }
            const result = await response.json();
            _githubSha = result.content.sha;
            console.log('✅ Database saved to GitHub');
        }

        // ============================================================

        // ============================================================
        function getInitials(name) {
            if (!name) return 'U';
            return name.split(' ').map(w => w[0]).join('').toUpperCase().slice(0, 2);
        }

        function looksLikeHash(pwd) {
            if (!pwd) return false;
            if (pwd.startsWith('hashed_')) return true;
            if (pwd.startsWith('$2a$') || pwd.startsWith('$2y$') || pwd.startsWith('$2b$')) return true;
            if (pwd.length > 40 && /^[a-f0-9]{32,}$/i.test(pwd)) return true;
            if (pwd.length > 40 && /^[A-Za-z0-9+/]{40,}=*$/.test(pwd)) return true;
            if (pwd.includes(':') && pwd.length > 30) return true;
            return false;
        }

        async function checkSessionAndAccess() {
            const saved = sessionStorage.getItem('auth_user');
            if (!saved) {
                showToast('Please log in first.', 'error');
                setTimeout(() => { window.location.href = 'login.html'; }, 800);
                return;
            }
            try {
                const user = JSON.parse(saved);
                const exists = dbData.users.find(u => u.id === user.id);
                if (!exists) {
                    sessionStorage.removeItem('auth_user');
                    showToast('User not found in database.', 'error');
                    setTimeout(() => { window.location.href = 'login.html'; }, 800);
                    return;
                }
                const allowedEmail = 'itarvincyberdevstack@gmail.com';
                const allowedName = 'arvin';
                if (exists.email.toLowerCase() !== allowedEmail.toLowerCase() ||
                    exists.name.toLowerCase() !== allowedName.toLowerCase()) {
                    showToast('Access denied. This page is for administrators only.', 'error');
                    setTimeout(() => { window.location.href = 'dashboard.html'; }, 800);
                    return;
                }
                renderManagement(exists);
            } catch {
                sessionStorage.removeItem('auth_user');
                window.location.href = 'login.html';
            }

        // ============================================================
        //  RENDER MANAGEMENT TABLE
        // ============================================================
        function renderManagement(currentUser) {
            document.getElementById('dashAvatar').textContent = getInitials(currentUser.name);
            document.getElementById('dashName').textContent = currentUser.name;
            document.getElementById('dashEmail').textContent = currentUser.email;

            const users = dbData.users || [];
            const tbody = document.getElementById('userTableBody');
            const empty = document.getElementById('emptyState');

            if (users.length === 0) {
                tbody.innerHTML = '';
                empty.style.display = 'block';
                return;
            }
            empty.style.display = 'none';

            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const filtered = users.filter(u =>
                u.name.toLowerCase().includes(searchTerm) ||
                u.username.toLowerCase().includes(searchTerm) ||
                u.email.toLowerCase().includes(searchTerm)
            );

            if (filtered.length === 0) {
                tbody.innerHTML =
                    `<tr><td colspan="5" style="text-align:center;color:rgba(255,255,255,0.1);padding:30px;">No matching users</td></tr>`;
                return;
            }

            tbody.innerHTML = filtered.map(u => {
                const isSelf = u.id === currentUser.id;
                const isHashed = looksLikeHash(u.password);
                return `
                        <tr>
                            <td>
                                <div class="user-cell">
                                    <div class="avatar-sm">${getInitials(u.name)}</div>
                                    <div class="info">
                                        <div class="name">${u.name} ${isSelf ? '👑' : ''}</div>
                                        <div class="email">${u.email}</div>
                                    </div>
                                </div>
                            </td>
                            <td>${u.username}</td>
                            <td>${u.email}</td>
                            <td>
                                <span class="badge-role ${isSelf ? 'admin' : ''}">${isSelf ? 'Admin' : 'Player'}</span>
                                ${isHashed ? `<span class="hash-warning"><i class="fas fa-lock"></i> hashed</span>` : ''}
                            </td>
                            <td style="text-align:right;">
                                <div class="action-btns">
                                    <button class="edit" data-id="${u.id}" title="Edit"><i class="fas fa-pen"></i></button>
                                    <button class="delete" data-id="${u.id}" title="Delete" ${isSelf ? 'disabled' : ''}><i class="fas fa-trash"></i></button>
                                </div>
                            </td>
                        </tr>
                    `;
            }).join('');

            document.querySelectorAll('.edit').forEach(btn => {
                btn.addEventListener('click', () => openEditModal(btn.dataset.id));
            });
            document.querySelectorAll('.delete').forEach(btn => {
                btn.addEventListener('click', () => deleteUser(btn.dataset.id));
            });

        // ============================================================
        //  CRUD – DELETE
        // ============================================================
        async function deleteUser(userId) {
            if (!confirm('Delete this user permanently?')) return;
            const users = dbData.users.filter(u => u.id !== userId);
            dbData.users = users;
            try {
                await saveDatabase(dbData);
                showToast('User deleted.', 'success');
                const saved = sessionStorage.getItem('auth_user');
                if (saved) {
                    const current = JSON.parse(saved);
                    const exists = dbData.users.find(u => u.id === current.id);
                    if (exists) renderManagement(exists);
                    else { sessionStorage.removeItem('auth_user');
                        window.location.href = 'login.html'; }
                }
            } catch (err) {
                showToast('Error deleting user: ' + err.message, 'error');
            }
        }

        function openEditModal(userId) {

            modalTitle.innerHTML = '<i class="fas fa-user-edit"></i> Edit User';

            formName.value = user.name;
            formUsername.value = user.username;
            formEmail.value = user.email;
            const rawPwd = user.password || '';
            formPassword.value = rawPwd;

            if (isHashed && rawPwd.length > 0) {

            let users = dbData.users || [];

                    users[index] = { ...users[index], name, username, email, password };
                }

                        .slice(2),

                    email,
                    password,

            dbData.users = users;

                await saveDatabase(dbData);

                if (saved) {
                    const current = JSON.parse(saved);
                    const exists = dbData.users.find(u => u.id === current.id);
                    if (exists) renderManagement(exists);
                    else { sessionStorage.removeItem('auth_user');

                }

                showToast('No database data to export.', 'warning');
                return;

            const json = JSON.stringify(dbData, null, 2);
            const blob = new Blob([json], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `CasinoDB_export_${new Date().toISOString().slice(0,10)}.json`;

        // ============================================================

        // ============================================================
        function showToast(msg, type = 'success') {
            const t = document.getElementById('toast');
            const m = document.getElementById('toastMessage');
            const icon = t.querySelector('i');
            t.className = 'toast ' + type;
            const icons = {
                success: 'fas fa-check-circle',
                error: 'fas fa-exclamation-circle',
                warning: 'fas fa-exclamation-triangle',
                info: 'fas fa-info-circle'
            };
            icon.className = icons[type] || icons.info;
            m.textContent = msg;
            t.classList.add('show');
            clearTimeout(t._timer);
            t._timer = setTimeout(() => t.classList.remove('show'), 3200);
        }

        // ============================================================
        //  INIT
        // ============================================================
        (async function init() {
            showUI(false);
            updateStatus('spinning', '📡', 'Connecting to Web app…', 'Loading database from repository…');
            setProgress(10);

            const token = localStorage.getItem(GITHUB_TOKEN_KEY);
            if (!token) {
                updateStatus('🔑', '🔑', 'Web app Password Required', 'Please enter your Web app password for security purposes.',
                    'Click "Retry" to enter your password.');
                showRetryButtons(true);
                showToast('Web app Password Required.', 'info');
                setDbStatus('offline', 'no token');
            } else {
                const success = await loadDatabase(true);
                if (!success) {
                    showRetryButtons(true);
                }
            }
        })();

        console.log('👑 Account Management initialized (GitHub database).');
    </script>

</body>
</html>
